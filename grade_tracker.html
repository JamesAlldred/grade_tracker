// Storage abstraction — works in Claude (window.storage) or as a local file (localStorage)
const STORAGE_KEY = 'grade-tracker-blank-v1';

// A window.storage GLOBAL merely existing isn't proof it's the real Claude artifact storage
// bridge, or that anything written to it actually survives. Observed in practice: opening a
// locally-downloaded copy of this file (e.g. via "Set default data") in a plain desktop
// browser that also has a Claude browser extension installed can still see a window.storage
// object - injected by the extension, present on every page, not just genuine claude.ai
// artifacts - so the old typeof-only check reported "Claude storage" and saves looked like
// they'd worked while not actually persisting. detectStorageMode below does a same-session
// set-then-get round trip on a disposable probe key before trusting window.storage for
// anything real; only a value that reads back exactly as written counts as working. Both
// USE_CLAUDE_STORAGE and storageModeLabel start pessimistic (assume plain localStorage) and
// only flip once that round trip has actually succeeded - the safer default if detection
// itself somehow fails, since localStorage genuinely works in every normal browser.
let USE_CLAUDE_STORAGE = false;
let storageModeLabel = 'local storage';

async function detectStorageMode() {
  const looksPresent = typeof window.storage !== 'undefined'
    && typeof window.storage.get === 'function'
    && typeof window.storage.set === 'function';
  let verified = false;
  if (looksPresent) {
    // A single immediate set-then-get isn't safe to treat as a definitive answer. The real
    // storage backend can have a brief moment of read-after-write lag, and per its own
    // documented behaviour a get() on a key that isn't visible yet THROWS rather than
    // returning null - so a probe that only tries once can easily misread "hasn't
    // propagated yet" as "doesn't work at all", exactly the kind of false negative that
    // would (again) show the wrong storage location, just in the opposite direction from
    // the original bug this whole function exists to catch.
    //
    // The write happens exactly ONCE - only the read is retried. Re-issuing set() on every
    // attempt would just create a fresh write with its own fresh propagation lag each time,
    // which could never actually converge under retry; polling the read for the ONE write
    // already made is what actually distinguishes "still propagating" from "genuinely
    // doesn't work". Still failing to read it back after every attempt means genuinely
    // broken; succeeding partway through means it just needed a moment. Costs nothing in
    // the common case (no window.storage at all skips this whole block), and at most a few
    // hundred milliseconds, once, in the case that was already going to fall back anyway.
    const probeKey = `${STORAGE_KEY}-probe`;
    const probeValue = `probe-${Date.now()}-${Math.random()}`;
    try {
      await window.storage.set(probeKey, probeValue);
      const attempts = 3;
      for (let i = 0; i < attempts && !verified; i++) {
        if (i > 0) await new Promise(r => setTimeout(r, 150 * i));
        try {
          const result = await window.storage.get(probeKey);
          verified = !!result && result.value === probeValue;
        } catch(e) {
          verified = false;
        }
      }
    } catch(e) {
      // The write itself failed outright - not a propagation-timing question, genuinely
      // not working, retrying reads wouldn't change that.
      verified = false;
    }
    if (verified) { try { await window.storage.delete(probeKey); } catch(e) {} }
  }
  USE_CLAUDE_STORAGE = verified;
  storageModeLabel = USE_CLAUDE_STORAGE ? 'Claude storage' : 'local storage';
}

async function storageSave(key, value) {
  if (USE_CLAUDE_STORAGE) {
    try {
      await window.storage.set(key, value);
      return;
    } catch(e) {
      // The bridge worked at startup but stopped mid-session - fall back rather than
      // silently losing this save, and stop trusting it for the rest of the session.
      USE_CLAUDE_STORAGE = false;
      storageModeLabel = 'local storage';
      updateStorageModeLabel();
      showToast('Switched to local storage - the Claude storage bridge stopped responding');
    }
  }
  localStorage.setItem(key, value);
}

async function storageLoad(key) {
  if (USE_CLAUDE_STORAGE) {
    try {
      const result = await window.storage.get(key);
      return result ? result.value : null;
    } catch(e) {
      // A missing key throws here rather than resolving to null (see the storage docs) -
      // that's the normal, expected shape of "nothing saved under this key yet" (a brand
      // new artifact, or simply a preference - theme, Advanced, Assignments - that's never
      // been set), not evidence the storage bridge itself is broken. Treating it as a
      // bridge failure was the actual bug behind "says local storage on a genuine Claude
      // artifact": on a fresh load, THEME_KEY/ADVANCED_KEY/ASSIGNMENTS_KEY (and sometimes
      // even STORAGE_KEY itself) very often don't exist yet, so this fired on essentially
      // every first-ever load and permanently downgraded the whole session before the
      // person had done anything at all. detectStorageMode()'s own dedicated round-trip
      // probe at startup (set, then read that exact key back) is what actually determines
      // whether the bridge works - that determination shouldn't be silently overturned by
      // an ordinary "not found" on some unrelated key. If the bridge has genuinely failed,
      // a subsequent storageSave() call will still catch that for real, the one time it
      // actually matters: an attempted write failing.
      return null;
    }
  }
  return localStorage.getItem(key);
}

function updateStorageModeLabel() {
  const el = document.getElementById('storage-mode-label');
  if (el) el.textContent = `Your course — your university · saving to ${storageModeLabel}`;
}

async function saveData() {
  try {
    state.lastSavedAt = Date.now();
    await storageSave(STORAGE_KEY, JSON.stringify(state));
    showToast(`Saved (${storageModeLabel})`);
    renderSaveStatus();
  } catch(e) {
    showToast('Could not save');
  }
}

// Fills in any fields missing from an older/incoming save (whether from storage or an imported file).
function patchState(s) {
  s.modules.forEach(m => { if (m.credits === undefined) m.credits = 0; });
  s.modules.forEach(m => {
    if (m.examPct === undefined)   m.examPct = null;
    if (m.cwPct === undefined)     m.cwPct = null;
    if (m.presPct === undefined)   m.presPct = null;
    if (m.examGrade === undefined) m.examGrade = null;
    if (m.cwGrade === undefined)   m.cwGrade = null;
    if (m.presGrade === undefined) m.presGrade = null;
    if (m.indivPct === undefined)   m.indivPct = null;
    if (m.groupPct === undefined)   m.groupPct = null;
    if (m.indivGrade === undefined) m.indivGrade = null;
    if (m.groupGrade === undefined) m.groupGrade = null;
    // "By module" defaults unticked for every year, matching addModule.
    if (m.gradeByModule === undefined) m.gradeByModule = false;
    if (m.weightAsFraction === undefined) m.weightAsFraction = false;
    // Manual reorder state. An old save's modules have never been manually touched,
    // so they default to unlocked - i.e. carry on auto-sorting by mark exactly as
    // they always did, until the first time one of them is dragged.
    if (m.orderLocked === undefined) m.orderLocked = false;
    if (m.orderIndex === undefined) m.orderIndex = null;
  });
  s.modules.forEach(m => {
    if (m.sem === undefined || m.sem === null) {
      // Year 1's modules are genuinely Full Year at this institution (one module
      // spans the whole year, unlike Year 2+ where modules are semester-specific) -
      // only matters for a module that's never had a real sem value at all (this
      // guard means it's a one-time default, not something that re-applies over an
      // already-set value, including the person's own manual choice from the
      // dropdown).
      m.sem = SEM_NAME_MAP[m.name] !== undefined ? SEM_NAME_MAP[m.name] : (m.year <= 1 ? 0 : 1);
    }
  });
  s.modules.forEach(m => { if (!Array.isArray(m.components)) m.components = []; });
  s.modules.forEach(m => { (m.components || []).forEach(c => { if (c.weightFraction === undefined) c.weightFraction = null; }); });
  // Feedback moved from the module level to the assignment (component) level - any
  // component from a save made before that change simply has no feedback field yet.
  s.modules.forEach(m => { (m.components || []).forEach(c => { if (c.feedback === undefined) c.feedback = ''; }); });
  // Per-assignment semester tag, only ever meaningful for a Full Year module's
  // components (see fullYearComponentSemesterShare) - defaults to Full Year (0),
  // same as an untagged assignment always has, until someone says otherwise.
  s.modules.forEach(m => { (m.components || []).forEach(c => { if (c.sem === undefined) c.sem = 0; }); });
  // One-time migration: Year 1 used to default "By module" to ticked (protecting a
  // manually-entered mark while assignment records were still incomplete). Now that
  // Year 1 has the same % done/semester/category features as every other year, any
  // Year 1 module that hasn't been through this migration before gets "By module"
  // unticked once, so its mark and % done switch over to being calculated from its
  // components - exactly like every other year. A module with no components yet is
  // unaffected either way, since recomputeModuleFromComponents below has nothing to
  // calculate from and leaves it untouched. The marker means this runs once per
  // module (every module gets marked, not just Year 1's, so nothing is left
  // permanently unmarked) - after that, the checkbox is the sole source of truth
  // again, including a deliberate re-tick, which this must never undo.
  s.modules.forEach(m => {
    if (m._gradeModeMigrated) return;
    m._gradeModeMigrated = true;
    if (m.year <= 1) m.gradeByModule = false;
  });
  // One-time migration from the old [XY] bracket-tag system to the cat/grp checkbox
  // fields: if a component has never been touched by the migration before (no
  // _tagMigrated marker) and still has a [XY] tag in its name, seed cat/grp from it
  // so existing tagged data keeps working immediately, with nothing to redo by hand.
  // The marker means this only ever runs once per component - after that, the
  // checkboxes are the sole source of truth, including a deliberate "both unchecked"
  // state, which would otherwise be indistinguishable from "never migrated" on a
  // component whose name still happens to contain old bracket text.
  s.modules.forEach(m => {
    m.components.forEach(c => {
      if (c._tagMigrated) return;
      c._tagMigrated = true;
      if (c.cat === undefined) c.cat = null;
      if (c.grp === undefined) c.grp = null;
      if (c.cat === null && c.grp === null) {
        const match = (c.name || '').match(/\[([ig])([ecp])\]/i);
        if (match) {
          c.grp = match[1].toUpperCase();
          c.cat = match[2].toUpperCase();
        }
      }
    });
  });
  // Recalculate every module's component-derived fields from its actual components,
  // rather than trusting whatever was last persisted for them. This is what makes a
  // freshly-added calculation (or a fix to an existing one) apply retroactively to data
  // entered before that code existed, instead of silently sitting stale until the next
  // manual edit happens to touch that specific module's components again.
  s.modules.forEach(m => {
    recomputeModuleFromComponents(m);
    recomputeExamCwPresFromComponents(m);
    recomputeIndivGroupFromComponents(m);
  });
  if (typeof s.nextComponentId !== 'number') {
    const highest = s.modules.reduce((a, m) => (m.components || []).reduce((b, c) => Math.max(b, c.id || 0), a), 0);
    s.nextComponentId = highest + 1;
  }
  // state.years is the canonical, ordered list of active years - added so years can
  // be added/removed at runtime (see addYear/removeYear) instead of the tracker
  // always assuming exactly four. Derived here BEFORE yearWeights/yearTotalCredits
  // get their own defaults filled in just below - deriving it after would pick up
  // phantom year-4 entries from DEFAULT_YEAR_TOTAL_CREDITS's own keys whenever an old
  // save was missing that field entirely, rather than reflecting only real data.
  // Falls back to the original 1-4 if genuinely nothing is found anywhere (e.g. a
  // completely empty, module-less save).
  if (!Array.isArray(s.years) || !s.years.length) {
    const found = new Set([
      ...Object.keys(s.yearWeights || {}).map(Number),
      ...Object.keys(s.yearTotalCredits || {}).map(Number),
      ...s.modules.map(m => m.year)
    ].filter(y => Number.isInteger(y) && y > 0));
    s.years = found.size ? Array.from(found).sort((a, b) => a - b) : [1, 2, 3, 4];
  }
  if (!s.yearWeights)      s.yearWeights      = { ...DEFAULT_YEAR_WEIGHTS };
  if (!s.yearTotalCredits) s.yearTotalCredits = { ...DEFAULT_YEAR_TOTAL_CREDITS };
  if (!s.collapsedYears)   s.collapsedYears   = {};
  s.years.forEach(y => {
    if (s.yearWeights[y]      === undefined) s.yearWeights[y]      = DEFAULT_YEAR_WEIGHTS[y]      !== undefined ? DEFAULT_YEAR_WEIGHTS[y]      : 0;
    if (s.yearTotalCredits[y] === undefined) s.yearTotalCredits[y] = DEFAULT_YEAR_TOTAL_CREDITS[y] !== undefined ? DEFAULT_YEAR_TOTAL_CREDITS[y] : 120;
    if (s.collapsedYears[y]   === undefined) s.collapsedYears[y]   = false;
  });
  if (!s.nextId) {
    s.nextId = s.modules.reduce((a, m) => Math.max(a, m.id), 0) + 1;
  }
  // sideCourses is entirely separate from the degree tracker (see addSideCourse etc.)
  // - own array, own id counter, never touched by any degree calculation. Backfilled
  // the same way as every other field added after the initial save format.
  if (!Array.isArray(s.sideCourses)) s.sideCourses = [];
  if (!s.nextSideCourseId) {
    s.nextSideCourseId = s.sideCourses.reduce((a, c) => Math.max(a, c.id), 0) + 1;
  }
  // Each course's own components array (its "assignments" equivalent) is a later
  // addition too, so backfill it the same way for any course saved before it existed.
  s.sideCourses.forEach(c => { if (!Array.isArray(c.components)) c.components = []; });
  // Course status is now purely derived from its parts (see deriveSideCourseStatus) -
  // recompute on every load so a course saved before this existed, or one whose saved
  // status is otherwise out of step with its parts, settles into the correct value
  // rather than keeping a stale manually-set one.
  s.sideCourses.forEach(c => { c.status = deriveSideCourseStatus(c); });
  if (!s.nextSideCourseComponentId) {
    const highest = s.sideCourses.reduce((a, c) => c.components.reduce((b, comp) => Math.max(b, comp.id || 0), a), 0);
    s.nextSideCourseComponentId = highest + 1;
  }
  // Folders are a later addition too: purely organisational grouping for courses
  // (see the drag machinery comment above), never read by any calculation. A course
  // saved before folders existed has no folderId, which backfills to null - the
  // same value new courses get explicitly - meaning "ungrouped, in the root list".
  if (!Array.isArray(s.sideCourseFolders)) s.sideCourseFolders = [];
  if (!s.nextSideCourseFolderId) {
    s.nextSideCourseFolderId = s.sideCourseFolders.reduce((a, f) => Math.max(a, f.id), 0) + 1;
  }
  s.sideCourses.forEach(c => { if (c.folderId === undefined) c.folderId = null; });
  // Steps (Course + Part level) defaults to '-', a deliberate choice by the person (not ''
  // like most other free-text fields - see "Working style" in the handoff). Unaffected by
  // the Type change below.
  //
  // Type (Part level only) changed shape this session: it's now a fixed dropdown (Theory /
  // Workshop / Lab / Review / Exam / Certification Project), not free text, and its
  // default/blank option is '' - not '-' like it briefly was in the previous free-text
  // version. Any part still carrying that stale '-' (or missing the field entirely, e.g.
  // DEFAULT_DATA or an old save from before either version of this feature existed) gets
  // migrated to '' here, since '-' isn't one of the fixed options any more and would
  // otherwise silently render as the blank option while still holding a mismatched stored
  // value until the person happened to touch that specific dropdown.
  s.sideCourses.forEach(c => {
    if (c.steps === undefined) c.steps = '-';
    (c.components || []).forEach(comp => {
      if (comp.steps === undefined) comp.steps = '-';
      if (comp.type === undefined || comp.type === '-') comp.type = '';
    });
  });
  // Proof of completion (Course + Part level, one PNG/JPG image per row, stored as a base64
  // data URL - see pocWidget/handlePocFileSelected). Gated entirely by the course's own
  // pocEnabled checkbox, off by default for both existing and new courses, so nothing about
  // this feature is visible anywhere until the person explicitly turns it on for a given
  // course. A part never gets its own enabled flag, only its own attached-or-not poc value -
  // whether that value is ever shown is decided purely by its parent course's checkbox.
  s.sideCourses.forEach(c => {
    if (c.pocEnabled === undefined) c.pocEnabled = false;
    if (c.poc === undefined) c.poc = null;
    (c.components || []).forEach(comp => { if (comp.poc === undefined) comp.poc = null; });
  });
  // Pure metadata for the "how stale is this" indicator (see renderSaveStatus) - not
  // read by any calculation. Deliberately lives inside state (unlike the theme
  // preference) so it travels with export/import: an imported backup honestly reports
  // when it was last saved before being exported, rather than picking up whatever the
  // importing device's own history happens to be.
  if (s.lastSavedAt === undefined)    s.lastSavedAt = null;
  if (s.lastExportedAt === undefined) s.lastExportedAt = null;
  return s;
}

async function loadData() {
  try {
    const raw = await storageLoad(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e) {
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  patchState(state);
  await checkEmptyDataReminder();
  render();
}

// --- Live Server / dev-server port history ------------------------------------
// A local dev server (VS Code Live Server and similar) can land on a different port
// between sessions - and unlike everything else about the file staying put, that
// genuinely changes the page's origin as far as localStorage is concerned (origin =
// scheme + host + port; only that exact triple can see a given origin's data - a
// different port is a completely separate, empty bucket, not a private view onto the
// same one). There is no way to work around that from inside the page - it's a hard
// browser security boundary, not a bug here - so this can only ever explain what
// happened, never actually recover data left behind on a previous port. The real fix
// lives outside this file: pin Live Server to a fixed port (VS Code settings ->
// "liveServer.settings.port"), so the origin never moves in the first place.
//
// Cookies are NOT port-scoped the way localStorage is (same host, any port, one shared
// cookie jar), so a tiny cookie recording the last-seen port is enough to detect the
// mismatch. This deliberately folds into the existing empty-data-banner below rather
// than being its own banner: the two situations it's disambiguating ("this really is a
// fresh install" vs "this is the same install, just a different port") both show
// exactly the same symptom - state matches DEFAULT_DATA - so it belongs alongside that
// banner's own message, not as a second, separate warning competing for attention.
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value) {
  // No `Secure` flag deliberately - Live Server serves plain http://, and a Secure
  // cookie is silently dropped on a non-https origin, which would make this whole
  // check quietly stop working the moment someone tests it locally.
  document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=31536000; SameSite=Lax`;
}

let portMismatch = null; // { previousPort, currentPort } once detected, else null
function checkPortHistory() {
  // Only meaningful for a page served over http/https - file:// cookies are
  // unreliable across browsers anyway, and Claude's own artifact preview doesn't hop
  // between ports the way a local dev server does, so there's nothing to detect there.
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  const currentPort = location.port || (location.protocol === 'https:' ? '443' : '80');
  const previousPort = getCookie('gt-last-port');
  if (previousPort && previousPort !== currentPort) {
    portMismatch = { previousPort, currentPort };
  }
  setCookie('gt-last-port', currentPort);
}
checkPortHistory();

// --- Empty-data reminder -----------------------------------------------------
// There's no reliable way to tell "this file got moved and lost its storage" apart
// from "this is a genuinely brand-new install" - both look identical from here, since
// arriving at a new file path always means starting from a completely empty slate.
// The only usable signal is that the currently loaded data is still exactly the
// untouched default template. That's true in both cases, so this is deliberately a
// one-time, low-friction nudge rather than an alarm - useful either way, and never
// shown again at this location once it's been shown here once. This whole section is
// read-only with respect to academic data: it only ever compares state to a fresh
// copy of DEFAULT_DATA, never mutates state itself, and doesn't touch loadData's
// existing load path beyond the one line above.
const EMPTY_REMINDER_KEY = 'grade-tracker-blank-empty-reminder-shown-v1';
let emptyDataBannerEligible = false;
let emptyDataBannerDismissed = false;

function isStateStillDefault() {
  if (!state) return false;
  const freshDefault = patchState(JSON.parse(JSON.stringify(DEFAULT_DATA)));
  return JSON.stringify(state) === JSON.stringify(freshDefault);
}

async function checkEmptyDataReminder() {
  // Reset first, not just set-to-true-when-eligible: this function is only ever
  // called once per real page load in practice (from loadData's own bootstrap), but
  // making it idempotent - always fully re-deriving the flag rather than only ever
  // setting it - means calling it again mid-session (as a test harness reasonably
  // might) can't leave a stale true value behind from an earlier, now-irrelevant check.
  emptyDataBannerEligible = false;
  try {
    if (!isStateStillDefault()) return;
    const alreadyShown = await storageLoad(EMPTY_REMINDER_KEY);
    if (alreadyShown === '1') return;
    emptyDataBannerEligible = true;
    // Written immediately, not on dismiss - this must only ever appear once per
    // location, even if the tab is closed before anyone clicks anything on it.
    await storageSave(EMPTY_REMINDER_KEY, '1');
  } catch (e) {
    // If the reminder-flag check itself fails, default to not showing anything extra.
  }
}

function dismissEmptyDataBanner() {
  emptyDataBannerDismissed = true;
  render();
}

function renderEmptyDataBanner() {
  const wrap = document.getElementById('empty-data-banner-wrap');
  if (!wrap) return;
  // Re-checked live on every render, not just once at load: the moment real data
  // gets entered, state no longer matches the default template and this banner
  // disappears on its own, without needing the explicit dismiss button.
  const show = emptyDataBannerEligible && !emptyDataBannerDismissed && isStateStillDefault();
  const portNote = (show && portMismatch)
    ? ` This page previously loaded on port ${escapeHtml(portMismatch.previousPort)} and is now on port ${escapeHtml(portMismatch.currentPort)} — if you're using VS Code Live Server, a changing port looks like a brand new location to the browser every time. Pin Live Server to a fixed port ("liveServer.settings.port" in VS Code settings) to stop this happening.`
    : '';
  wrap.innerHTML = show ? `
    <div class="empty-data-banner">
      📋 <strong>This looks like a fresh start</strong> — no course data has been saved at this location yet. If you have an exported backup (e.g. from before moving this file), import it now instead of starting over.${portNote}
      <button onclick="document.getElementById('import-file-input').click()">Import data</button>
      <button onclick="dismissEmptyDataBanner()">Dismiss</button>
    </div>` : '';
}


// Downloads the current data as a .json file. Use this to carry your data between
// the Claude artifact and any standalone copy of this file (their storage is separate).
function exportData() {
  try {
    state.lastExportedAt = Date.now();
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grade-tracker-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Data exported');
    renderSaveStatus();
    scheduleSave(); // persists the updated lastExportedAt too, not just the downloaded file
  } catch(e) {
    showToast('Could not export data');
  }
}

// "Set default data": bakes the CURRENT state into DEFAULT_DATA and downloads a whole new
// copy of this file with it, so a completely fresh load (no saved storage at all - a new
// device, a cleared browser, etc.) starts from today's real data instead of whatever was
// baked in the last time this button was used. There's no server and a page can't overwrite
// the very file it was opened from, so a fresh download - which the person then saves over
// their existing copy - is the only thing actually available here; the confirm modal and
// the toast afterwards both say so plainly rather than implying anything more automatic.
//
// Finds the existing `const DEFAULT_DATA = { ... };` block inside OWN_SOURCE_HTML (captured
// right at the top of this script, before any rendering - see its own comment) and swaps
// in a freshly generated one. Depends on the block always starting with the exact text
// "const DEFAULT_DATA = {" and its closing brace always sitting alone on its own line as
// "};" with no leading indentation - the same convention this block has been hand-written
// in every time it's been rebaked in past sessions, and the only convention
// buildDefaultDataBlock itself ever produces, so this stays self-consistent across repeat
// uses even though the very first search still relies on matching what's already there.
function locateDefaultDataBlock(sourceHtml) {
  const startMarker = 'const DEFAULT_DATA = {';
  const start = sourceHtml.indexOf(startMarker);
  if (start === -1) return null;
  const endMarker = '\n};';
  const endMarkerIdx = sourceHtml.indexOf(endMarker, start);
  if (endMarkerIdx === -1) return null;
  return { start, end: endMarkerIdx + endMarker.length };
}

function buildDefaultDataBlock() {
  const json = JSON.stringify(state, null, 2); // starts "{\n", ends "\n}" for any non-empty state
  const inner = json.substring(1, json.length - 1); // strip just the outer { }, keeping its own leading/trailing newline - exactly what belongs between "= {" and the closing "};"
  const dateStr = new Date().toISOString().slice(0, 10);
  return `const DEFAULT_DATA = {\n  // This is the fallback used when no saved data exists.\n  // Baked in via the "Set default data" button on ${dateStr}.${inner}};`;
}

async function handleSetDefaultData() {
  const ok = await showConfirmModal('Set the default data to the data currently in this file? This downloads an updated copy of the file with today\'s data baked in - you\'ll need to save it over your existing copy for it to actually take effect.');
  if (!ok) return;
  try {
    const bounds = locateDefaultDataBlock(OWN_SOURCE_HTML);
    if (!bounds) { showToast("Couldn't find the default data block to update"); return; }
    const newHtml = OWN_SOURCE_HTML.slice(0, bounds.start) + buildDefaultDataBlock() + OWN_SOURCE_HTML.slice(bounds.end);
    const blob = new Blob([newHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // Named after THIS file, not the original tracker - the two now live side by side in
    // the same git repo folder, so downloading a file literally called "grade_tracker.html"
    // from here would be a very easy way to overwrite (or just confuse yourself with) the
    // real tracker by accident.
    a.download = 'grade_tracker_blank.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Updated file downloaded - save it over your existing copy to make it the new default');
  } catch(e) {
    showToast('Could not build the updated file');
  }
}

// "How stale is this" indicator (see save-status in the toolbar). Answers two
// different questions: "last saved" is whether what's on screen is actually backed up
// in THIS location's storage right now; "last exported" is how old a downloaded
// backup file would be if restoring from one became necessary. Both matter
// separately after moving the file to a new folder/device, since that move starts
// this location's storage from scratch regardless of either timestamp.
function formatRelativeTime(ts) {
  if (!ts) return 'never';
  const diffMs = Date.now() - ts;
  if (diffMs < 10000) return 'just now';
  const sec = Math.floor(diffMs / 1000);
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day}d ago`;
  // Beyond a week, an absolute date is more useful than "2 weeks ago"
  return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderSaveStatus() {
  const el = document.getElementById('save-status');
  if (!el || !state) return;
  const savedText = state.lastSavedAt ? formatRelativeTime(state.lastSavedAt) : '<span class="save-status-stale">never</span>';
  const exportedText = state.lastExportedAt ? formatRelativeTime(state.lastExportedAt) : 'never';
  el.innerHTML = `Saved ${savedText} in this location · Last exported ${exportedText}`;
}

// --- PDF / print transcript ------------------------------------------------
// Reuses the same classification bands as markColor/the grade distribution chart,
// just as a text label rather than a color.
function classify(mark) {
  if (mark === null || mark === undefined || isNaN(mark)) return '—';
  if (mark >= 70) return 'First';
  if (mark >= 60) return '2:1';
  if (mark >= 50) return '2:2';
  if (mark >= 40) return '3rd';
  return 'Fail';
}

// Rebuilds the hidden #transcript-container from the current state. Called at the
// end of render(), same pattern as renderCharts(), so it's always in sync and the
// print button/Ctrl+P never shows stale data. Deliberately plain, black-on-white
// table markup, not the app's dark-mode-aware theme, since this is meant to be
// printed or saved as a PDF for someone outside the tracker (an advisor, a CV).
function renderTranscript() {
  const container = document.getElementById('transcript-container');
  if (!container) return;

  const years = getYears().filter(y => state.modules.some(m => m.year === y));
  const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  let html = `
    <div class="transcript-header">
      <h1>Degree Grade Transcript</h1>
      <p>Your course — your university</p>
      <p class="transcript-date">Generated ${dateStr}</p>
    </div>
  `;

  let anyExcluded = false;

  years.forEach(year => {
    const mods = state.modules
      .filter(m => m.year === year)
      .slice()
      .sort((a, b) => (a.sem || 0) - (b.sem || 0) || a.name.localeCompare(b.name));
    const showSem = true; // matches renderYear - Year 1 semesters are shown too now
    const avg = yearAvg(year, true, false);
    if (mods.some(m => m.excl)) anyExcluded = true;

    html += `
      <table class="transcript-table">
        <caption>${yearLabel(year)}</caption>
        <thead>
          <tr>
            <th>Module</th>
            ${showSem ? '<th>Sem</th>' : ''}
            <th>Credits</th>
            <th>Mark</th>
            <th>Classification</th>
          </tr>
        </thead>
        <tbody>
          ${mods.map(m => `
            <tr>
              <td>${escapeHtml(m.name)}${m.excl ? ' *' : ''}</td>
              ${showSem ? `<td>${m.sem === 0 ? 'Full Year' : (m.sem || '—')}</td>` : ''}
              <td>${m.credits || 0}</td>
              <td>${m.mark !== null && m.mark !== undefined ? Number(m.mark).toFixed(2) + '%' : '—'}${m.pct < 100 ? ' (in progress)' : ''}</td>
              <td>${classify(m.mark)}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="${showSem ? 3 : 2}">Year average${mods.some(m => m.excl) ? ' (excl. starred)' : ''}</td>
            <td colspan="2">${avg !== null ? avg.toFixed(2) + '%' : '—'}</td>
          </tr>
        </tfoot>
      </table>
    `;
  });

  const summary = calcSummary(false);
  html += `
    <table class="transcript-summary">
      <tbody>
        <tr><td>Cumulative weighted average</td><td>${summary.cumAvg !== null ? summary.cumAvg.toFixed(2) + '%' : '—'}</td></tr>
        <tr><td>Degree marks collected so far</td><td>${summary.marksCollected.toFixed(2)} / 100</td></tr>
        ${summary.neededFirst !== null ? `<tr><td>Average needed on remaining credits for a First</td><td>${summary.neededFirst.toFixed(2)}%</td></tr>` : ''}
        ${summary.needed21 !== null ? `<tr><td>Average needed on remaining credits for a 2:1</td><td>${summary.needed21.toFixed(2)}%</td></tr>` : ''}
      </tbody>
    </table>
    ${anyExcluded ? '<p class="transcript-footnote">* Excluded from that year\'s average.</p>' : ''}
  `;

  container.innerHTML = html;
}

// Plain, unscoped copy of the transcript rules from the main stylesheet's
// @media print block above, for use in the downloaded standalone file below - that
// file's entire body IS the transcript, so the rules apply directly rather than
// needing a print-media gate to hide everything else.
const TRANSCRIPT_PRINT_CSS = `
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color: #111; background: #fff; margin: 0; padding: 24px; }
  .transcript-header h1 { font-size: 19px; margin: 0 0 4px; }
  .transcript-header p { font-size: 12px; margin: 0 0 2px; color: #333; }
  .transcript-header .transcript-date { margin-bottom: 18px; color: #555; }
  .transcript-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; page-break-inside: avoid; }
  .transcript-table caption { text-align: left; font-size: 13px; font-weight: 600; padding: 8px 0 4px; }
  .transcript-table th, .transcript-table td { border: 1px solid #999; padding: 4px 8px; font-size: 11px; text-align: left; }
  .transcript-table tfoot td { font-weight: 600; background: #f0f0f0; }
  .transcript-summary { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .transcript-summary td { padding: 4px 8px; font-size: 12px; border: 1px solid #999; }
  .transcript-summary td:last-child { text-align: right; font-weight: 600; }
  .transcript-footnote { font-size: 10px; color: #555; margin-top: 8px; }
  @page { margin: 1.5cm; }
`;

// Downloads a standalone HTML file rather than calling window.print()/window.open()
// on the tracker itself. That distinction matters: when this file is running inside
// an embedded preview (e.g. a Claude artifact panel), the tracker's own window is
// itself inside a restricted frame, and new windows/tabs can be blocked outright with
// no user-facing setting to override it (unlike an ordinary browser pop-up block).
// A downloaded file sidesteps that entirely, since Blob-based downloads (the same
// mechanism exportData() already uses) aren't subject to that restriction. The saved
// file carries its own small script that fires window.print() the moment it's opened,
// since a file opened directly from disk is a completely ordinary, unrestricted
// browser tab where that call always works. Saving as PDF from that dialog is just
// picking "Save as PDF" as the destination, no PDF library needed.
function exportTranscript() {
  try {
    renderTranscript();
    const transcriptHtml = document.getElementById('transcript-container').innerHTML;
    const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Degree Grade Transcript</title>
<style>${TRANSCRIPT_PRINT_CSS}</style>
</head>
<body>
${transcriptHtml}
<script>window.onload = function() { window.print(); };<\/script>
</body>
</html>`;
    const blob = new Blob([fullHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grade-transcript-${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Transcript downloaded - open the file to print or save as PDF');
  } catch (e) {
    showToast('Could not export transcript');
  }
}

// Loads data from a previously exported .json file, replacing what's currently here.
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const incoming = JSON.parse(reader.result);
      if (!incoming || !Array.isArray(incoming.modules)) {
        showToast('That file doesn\'t look like a valid export');
        return;
      }
      pushHistory(); // so an accidental/wrong import can still be undone
      state = patchState(incoming);
      whatIfMode = false;
      whatIfOverrides = {};
      whatIfComponentOverrides = {};
      render();
      saveData(); // immediate, not scheduleSave - a debounced save can be lost if the tab
                  // closes before the 1s timer fires, and import is a one-off action anyway
      showToast('Data imported');
    } catch(e) {
      showToast('Could not read that file');
    }
  };
  reader.onerror = () => showToast('Could not read that file');
  reader.readAsText(file);
}

// Theme: 'auto' follows the OS setting via the CSS media query; 'light'/'dark' are explicit
// overrides applied via the data-theme attribute. Stored separately from the academic data
// (own storage key) since it's a device preference, not something to bundle into export/import.
const THEME_KEY = 'grade-tracker-blank-theme-v1';
let theme = 'auto';

function applyTheme() {
  if (theme === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) {
    const labels = { auto: '🌓 Auto theme', light: '☀️ Light mode', dark: '🌙 Dark mode' };
    btn.textContent = labels[theme];
  }
}

function cycleTheme() {
  theme = theme === 'auto' ? 'light' : (theme === 'light' ? 'dark' : 'auto');
  applyTheme();
  storageSave(THEME_KEY, theme).catch(() => {});
}

async function loadTheme() {
  try {
    const raw = await storageLoad(THEME_KEY);
    theme = (raw === 'light' || raw === 'dark' || raw === 'auto') ? raw : 'auto';
  } catch (e) {
    theme = 'auto';
  }
  applyTheme();
}

// Advanced view: shows/hides the exam %, coursework %, average exam/CW grade, and exclude
// columns. Off by default for a cleaner view. A display preference, so its own storage key,
// same reasoning as theme - kept out of the exported/imported academic data.
const ADVANCED_KEY = 'grade-tracker-blank-advanced-v1';
let advancedMode = false;

function updateAdvancedButton() {
  const btn = document.getElementById('advanced-toggle-btn');
  if (btn) btn.classList.toggle('active', advancedMode);
}

function toggleAdvanced() {
  advancedMode = !advancedMode;
  updateAdvancedButton();
  render();
  storageSave(ADVANCED_KEY, advancedMode ? '1' : '0').catch(() => {});
}

async function loadAdvanced() {
  try {
    const raw = await storageLoad(ADVANCED_KEY);
    advancedMode = raw === '1';
  } catch (e) {
    advancedMode = false;
  }
  updateAdvancedButton();
}

// Assignments view: shows/hides the per-module assessment component breakdown control
// (Year 2 and above only). A display preference like Advanced and theme, so its own
// storage key, kept out of the exported/imported academic data. The component data itself
// (state.modules[].components) is real academic data and lives in the main save/export.
const ASSIGNMENTS_KEY = 'grade-tracker-blank-assignments-v1';
let assignmentsMode = false;

function updateAssignmentsButton() {
  const btn = document.getElementById('assignments-toggle-btn');
  if (btn) btn.classList.toggle('active', assignmentsMode);
}

function toggleAssignments() {
  assignmentsMode = !assignmentsMode;
  updateAssignmentsButton();
  render();
  storageSave(ASSIGNMENTS_KEY, assignmentsMode ? '1' : '0').catch(() => {});
}

async function loadAssignments() {
  try {
    const raw = await storageLoad(ASSIGNMENTS_KEY);
    assignmentsMode = raw === '1';
  } catch (e) {
    assignmentsMode = false;
  }
  updateAssignmentsButton();
}

detectStorageMode().then(() => {
  updateStorageModeLabel();
  loadTheme();
  Promise.all([loadAdvanced(), loadAssignments()]).then(() => loadData());
});

// Keeps "Saved Xm ago" honest while the page just sits open with no edits happening
// to otherwise trigger a re-render.
setInterval(renderSaveStatus, 30000);
</script>
</body>
</html>
