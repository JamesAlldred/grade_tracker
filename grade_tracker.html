// Builds one component's what-if slider cell - same markup/CSS class as the
// module-level whatif-cell for visual consistency. Starting value is the existing
// override if there is one, otherwise the component's real mark, or 0 for a
// not-yet-marked component (a slider needs some numeric starting position, and 0 is
// the same "0 is a real, correct starting point" convention used elsewhere for
// unset fields).
function componentWhatIfCell(moduleId, c) {
  const overrides = whatIfComponentOverrides[moduleId];
  const hasOverride = overrides && overrides.hasOwnProperty(c.id);
  const wiVal = hasOverride
    ? overrides[c.id]
    : (c.mark !== null && c.mark !== undefined && c.mark !== '' && !isNaN(parseFloat(c.mark)) ? parseFloat(c.mark) : 0);
  return `<div class="whatif-cell">
      <input type="range" min="0" max="100" step="0.5" value="${wiVal}"
        oninput="liveComponentWhatIfUpdate(${moduleId}, ${c.id}, this.value)"
        onchange="applyComponentWhatIfChange(${moduleId}, ${c.id}, this.value)" />
      <span id="whatif-comp-val-${moduleId}-${c.id}">${wiVal.toFixed(1)}%</span>
      ${hasOverride ? `<button class="del-btn" title="Reset to actual mark" onclick="resetComponentWhatIf(${moduleId}, ${c.id})">↺</button>` : ''}
    </div>`;
}

// Builds one component's category/individual-group checkbox cell. Both groups are
// plain checkboxes rather than radio buttons, deliberately: checking one writes its
// letter straight to comp.cat/comp.grp (a single field, so a fresh render() always
// redraws the other boxes in the same group unchecked - that's what enforces "only
// one selected" without any extra bookkeeping), and unchecking the ticked box writes
// null, which checkboxes support naturally and radio buttons don't. Null is a valid,
// meaningful state here (an untagged component, still counted in the module's own
// mark but excluded from the E/CW/P and I/G breakdowns), so that "none selected"
// option has to stay reachable.
function componentTagCell(moduleId, c) {
  const catOptions = [['E', 'E', 'Exam'], ['C', 'CW', 'Coursework'], ['P', 'P', 'Presentation']];
  const grpOptions = [['I', 'I', 'Individual'], ['G', 'G', 'Group']];
  const catBoxes = catOptions.map(([val, label, title]) =>
    `<label class="comp-tag-box" title="${title}">
      <input type="checkbox" ${c.cat === val ? 'checked' : ''} onchange="updateComponent(${moduleId},${c.id},'cat', this.checked ? '${val}' : null)" />${label}
    </label>`
  ).join('');
  const grpBoxes = grpOptions.map(([val, label, title]) =>
    `<label class="comp-tag-box" title="${title}">
      <input type="checkbox" ${c.grp === val ? 'checked' : ''} onchange="updateComponent(${moduleId},${c.id},'grp', this.checked ? '${val}' : null)" />${label}
    </label>`
  ).join('');
  return `<div class="comp-tag-cell">
      <div class="comp-tag-group">${catBoxes}</div>
      <div class="comp-tag-group">${grpBoxes}</div>
    </div>`;
}

function renderYear(year) {
  const mods = state.modules.filter(m => m.year === year)
    .sort((a, b) => (a.sem ?? 0) - (b.sem ?? 0) || moduleEffectiveRank(b) - moduleEffectiveRank(a) || a.id - b.id);
  const included = mods.filter(m => !m.excl);
  const hasLockedModules = mods.some(m => m.orderLocked);
  // % done and the semester dropdown now apply uniformly to every year, matching
  // showExamCw/showAssignments above - Year 1 no longer has any special-cased UI.
  const showPct  = true;
  const showSem  = true;
  const showExamCw = advancedMode;
  const showExcl = advancedMode;
  const showAssignments = assignmentsMode;
  const exclMods = mods.filter(m => m.excl);

  // credit totals
  const totalCredits    = mods.reduce((a, m) => a + (m.credits || 0), 0);
  const creditsFilled   = totalCredits > 0;
  const yearTotal       = state.yearTotalCredits[year] || 120;
  const creditTallyHtml = `<span class="credits-tally">${totalCredits} / ${yearTotal} credits entered</span>`;

  // averages using yearAvg (which handles exclusion, credit-weighting + % done, and fallback internally)
  const yc = yearContribution(year, whatIfMode);
  const avgRawVal = yearAvg(year, false, whatIfMode);
  const avgAll   = yc.avg !== null ? yc.avg.toFixed(2) : '—'; // primary figure: excludes excluded modules
  const avgRaw   = avgRawVal !== null ? avgRawVal.toFixed(2) : '—'; // FYI only: including excluded modules
  const weighted = yc.avg !== null ? yc.points.toFixed(2) : '—';

  const totalCols = 6 + (showSem ? 1 : 0) + (showPct ? 1 : 0) + (showExamCw ? 4 : 0) + (showExcl ? 2 : 0) + (whatIfMode ? 1 : 0) + (showAssignments ? 1 : 0); // order, name, bar, mark, credits, del + optionals

  const rows = mods.map((m, i) => {
    const wiVal = whatIfOverrides.hasOwnProperty(m.id) ? whatIfOverrides[m.id] : m.mark;
    const comps = m.components || [];
    // "By module" protects the Mark/% done AND the Exam/CW/Pres/Indiv/Group columns
    // from being overwritten by the breakdown - uniformly across every year. (Year 1
    // used to have a temporary exception here while its assignment records were
    // still incomplete; now that they're complete, it behaves like every other year.)
    const hasComponents = comps.length > 0 && !m.gradeByModule;
    const isExpanded = showAssignments && expandedComponentModules.has(m.id);
    // Position within this module's own (year, sem) group - still needed for the
    // sem-box-top/bottom visual grouping below, independent of dragging.
    const isFirstInGroup = i === 0 || mods[i-1].sem !== m.sem;
    const isLastInGroup = i === mods.length - 1 || mods[i+1].sem !== m.sem;
    let rowClasses = ['data-row'];
    if (m.excl) rowClasses.push('excluded');
    if (showSem) {
      rowClasses.push('sem-boxed');
      if (isFirstInGroup) rowClasses.push('sem-box-top');
      if (isLastInGroup) rowClasses.push('sem-box-bottom');
    }
    // a slim spacer row opens a visual gap between one semester's box and the next
    const gapRow = (showSem && i > 0 && mods[i-1].sem !== m.sem) ? `<tr class="sem-gap"><td colspan="${totalCols}"></td></tr>` : '';
    const dragHandle = dragHandleHtml(`startModuleDrag(event,${m.id})`,
      showSem ? 'Drag to reorder within this semester' : 'Drag to reorder');

    // Component breakdown panel: only built when actually expanded. Weight is meant to sum
    // to 100 across the whole module (Essay 20% / Presentation 10% / Exam 70%, for example)
    // - or to a whole 1 in fraction mode - a mismatch is flagged but never blocks entry,
    // since it's normal mid-way through a module.
    const componentsPanelHtml = isExpanded ? (() => {
      let totalWeightDisplay, weightIsOff;
      if (m.weightAsFraction) {
        const totalFrac = addFractionsExact(comps.map(c => parseFraction(c.weightFraction) || { num: 0, den: 1 }));
        totalWeightDisplay = formatFraction(totalFrac) + (totalFrac.den === 1 ? '' : ` (${(fractionToPercent(totalFrac)).toFixed(2)}%)`);
        weightIsOff = totalFrac.num !== totalFrac.den;
      } else {
        const totalWeight = comps.reduce((a, c) => a + (parseFloat(c.weight) || 0), 0);
        totalWeightDisplay = `${totalWeight}%`;
        weightIsOff = totalWeight !== 100;
      }
      // A Full Year module's own Semester dropdown can't say WHEN within the year its
      // individual assignments actually happened - so Full Year modules only (never
      // Sem 1/Sem 2 ones, where the module's own dropdown already says everything
      // there is to say) get a second, per-assignment Semester dropdown here. Unlike
      // the module-level one, this never moves anything around the document - it's a
      // pure data tag, read by semesterAvg (see above) to give Year 1 a meaningful
      // Sem 1/Sem 2 breakdown despite its modules spanning the whole year.
      const showComponentSem = m.sem === 0;
      const compRows = comps.map((c, ci) => `
        <tr data-drag-id="${c.id}">
          <td class="comp-order">${dragHandleHtml(`startComponentDrag(event,${m.id},${c.id})`)}</td>
          <td><div class="comp-name-input" contenteditable="true" spellcheck="false" onblur="updateComponent(${m.id},${c.id},'name',this.textContent.trim())">${escapeHtml(c.name)}</div></td>
          <td>${m.weightAsFraction
            ? `<input type="text" inputmode="text" value="${escapeHtml(c.weightFraction ?? '')}" placeholder="e.g. 1/6" onchange="updateComponent(${m.id},${c.id},'weightFraction', this.value.trim())" />`
            : `<input type="number" value="${c.weight}" step="1" min="0" max="100" onchange="updateComponent(${m.id},${c.id},'weight',parseFloat(this.value)||0)" />`}</td>
          <td><input type="number" value="${c.mark===null||c.mark===undefined?'':c.mark}" placeholder="not marked" step="0.01" min="0" max="100" onchange="updateComponent(${m.id},${c.id},'mark', this.value===''?null:parseFloat(this.value))" /></td>
          <td class="comp-feedback">
            <span class="feedback-label ${c.feedback ? 'has-content' : ''}" tabindex="0" onclick="expandFeedback(this)" onkeydown="if(event.key==='Enter'){expandFeedback(this);}">Feedback</span>
            <div class="feedback-input" contenteditable="true" spellcheck="false" style="display:none" onblur="collapseComponentFeedback(this,${m.id},${c.id})">${escapeHtml(c.feedback || '')}</div>
          </td>
          <td>${componentTagCell(m.id, c)}</td>
          ${showComponentSem ? `<td class="comp-sem"><select onchange="updateComponent(${m.id},${c.id},'sem',parseInt(this.value))" title="When within the year this specific assignment happened - doesn't move it anywhere, just feeds the Semester 1/2 averages below">
              <option value="0" ${(c.sem ?? 0)===0?'selected':''}>Full Year</option>
              <option value="1" ${(c.sem ?? 0)===1?'selected':''}>Sem 1</option>
              <option value="2" ${(c.sem ?? 0)===2?'selected':''}>Sem 2</option>
            </select></td>` : ''}
          <td class="col-weightmode"><button class="weightmode-btn" onclick="toggleWeightMode(${m.id})" title="${m.weightAsFraction ? 'Switch back to percentage weights' : 'Switch to fraction weights - avoids the floating-point rounding an even split (e.g. sixths) hits as decimal percentages'}">${m.weightAsFraction ? 'Calculate as %' : 'Calculate as fraction'}</button></td>
          ${whatIfMode ? `<td>${componentWhatIfCell(m.id, c)}</td>` : ''}
          <td><button class="del-btn" onclick="deleteComponent(${m.id},${c.id})" title="Delete component">×</button></td>
        </tr>`).join('');
      return `
      <tr class="components-row">
        <td colspan="${totalCols}">
          <div class="components-panel">
            <table class="components-table">
              <thead><tr><th></th><th>Component</th><th>${m.weightAsFraction ? 'Weight fraction' : 'Weight %'}</th><th>Mark %</th><th>Feedback</th><th>Tags</th>${showComponentSem ? '<th>Semester</th>' : ''}<th></th>${whatIfMode ? '<th>What-if</th>' : ''}<th></th></tr></thead>
              <tbody>${compRows}</tbody>
            </table>
            <div class="components-footer">
              <button class="add-btn" onclick="addComponent(${m.id})">+ Add component</button>
              <span class="components-weight-note${weightIsOff ? ' weight-warning' : ''}">Total weight: ${totalWeightDisplay}${weightIsOff ? (m.weightAsFraction ? ' (should sum to 1)' : ' (should sum to 100%)') : ''}</span>
            </div>
            <div class="components-disclaimer">${componentsDisclaimerText(m)}</div>
            <div class="components-key">Tick one of E/CW/P and one of I/G to include a component in those breakdowns and the assignment chart. Leave both blank to exclude it - it'll still count toward the module's own mark.</div>
          </div>
        </td>
      </tr>`;
    })() : '';

    return `${gapRow}
    <tr class="${rowClasses.join(' ')}" data-drag-id="${m.id}" data-sem="${m.sem}">
      <td class="col-order">${dragHandle}</td>
      <td class="col-name"><div class="name-input" contenteditable="true" spellcheck="false" onblur="updateField(${m.id},'name',this.textContent.trim())">${escapeHtml(m.name)}</div></td>
      <td class="col-bar">${miniBar(m.mark)}</td>
      <td class="col-mark">${hasComponents ? `<input type="number" value="${m.mark}" disabled title="Calculated from the assessment breakdown below" />` : `<input type="number" value="${m.mark}" step="0.01" onchange="updateField(${m.id},'mark',parseFloat(this.value)||0)" />`}</td>
      <td class="col-credits"><input type="number" value="${m.credits || ''}" placeholder="–" step="1" min="0" onchange="updateField(${m.id},'credits',parseInt(this.value)||0)" /></td>
      ${showAssignments ? `<td class="col-assign"><button class="assign-toggle-btn" onclick="toggleComponents(${m.id})" title="Assessment breakdown - calculates the Running avg and % done above">
          <span class="chevron ${isExpanded ? '' : 'is-collapsed'}">▾</span> ${comps.length ? comps.length + ' part' + (comps.length > 1 ? 's' : '') : 'Breakdown'}
        </button></td>` : ''}
      ${showSem ? `<td class="col-sem"><select onchange="updateField(${m.id},'sem',parseInt(this.value))">
          <option value="0" ${m.sem===0?'selected':''}>Full Year</option>
          <option value="1" ${m.sem===1?'selected':''}>Sem 1</option>
          <option value="2" ${m.sem===2?'selected':''}>Sem 2</option>
        </select></td>` : ''}
      ${showPct ? `<td class="col-pct">${hasComponents ? `<input type="number" value="${m.pct}" disabled title="Calculated from the assessment breakdown below" />` : `<input type="number" value="${m.pct}" step="1" min="0" max="100" onchange="updateField(${m.id},'pct',Math.min(100,Math.max(0,parseInt(this.value)||0)))" />`}</td>` : ''}
      ${showExamCw ? `<td class="col-examcw-pct"><div class="dual-input">
          <input type="number" min="0" max="100" step="1" placeholder="Exam %" title="${hasComponents ? 'Calculated from [E]-tagged assessment components' : 'Exam % of module mark'}" value="${hasComponents ? (m.examPct ?? 0) : (m.examPct ?? '')}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'examPct', this.value===''?null:parseFloat(this.value))" />
          <input type="number" min="0" max="100" step="1" placeholder="CW %" title="${hasComponents ? 'Calculated from [C]-tagged assessment components' : 'Coursework % of module mark'}" value="${hasComponents ? (m.cwPct ?? 0) : (m.cwPct ?? '')}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'cwPct', this.value===''?null:parseFloat(this.value))" />
          <input type="number" min="0" max="100" step="1" placeholder="Pres %" title="${hasComponents ? 'Calculated from [P]-tagged assessment components' : 'Presentation % of module mark'}" value="${hasComponents ? (m.presPct ?? 0) : (m.presPct ?? '')}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'presPct', this.value===''?null:parseFloat(this.value))" />
        </div></td>
      <td class="col-examcw-grade"><div class="dual-input">
          <input type="text" inputmode="decimal" placeholder="Exam grade" title="${hasComponents ? 'Calculated from [E]-tagged assessment components' : 'Average exam grade (enter - for n/a)'}" value="${escapeHtml(hasComponents ? (m.examGrade ?? '-') : (m.examGrade ?? ''))}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'examGrade', this.value.trim()===''?null:this.value.trim())" />
          <input type="text" inputmode="decimal" placeholder="CW grade" title="${hasComponents ? 'Calculated from [C]-tagged assessment components' : 'Average coursework grade (enter - for n/a)'}" value="${escapeHtml(hasComponents ? (m.cwGrade ?? '-') : (m.cwGrade ?? ''))}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'cwGrade', this.value.trim()===''?null:this.value.trim())" />
          <input type="text" inputmode="decimal" placeholder="Pres grade" title="${hasComponents ? 'Calculated from [P]-tagged assessment components' : 'Average presentation grade (enter - for n/a)'}" value="${escapeHtml(hasComponents ? (m.presGrade ?? '-') : (m.presGrade ?? ''))}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'presGrade', this.value.trim()===''?null:this.value.trim())" />
        </div></td>
      <td class="col-ig-pct"><div class="dual-input">
          <input type="number" min="0" max="100" step="1" placeholder="Indiv %" title="${hasComponents ? 'Calculated from [I_]-tagged assessment components' : 'Individual % of module mark'}" value="${hasComponents ? (m.indivPct ?? 0) : (m.indivPct ?? '')}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'indivPct', this.value===''?null:parseFloat(this.value))" />
          <input type="number" min="0" max="100" step="1" placeholder="Group %" title="${hasComponents ? 'Calculated from [G_]-tagged assessment components' : 'Group % of module mark'}" value="${hasComponents ? (m.groupPct ?? 0) : (m.groupPct ?? '')}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'groupPct', this.value===''?null:parseFloat(this.value))" />
        </div></td>
      <td class="col-ig-grade"><div class="dual-input">
          <input type="text" inputmode="decimal" placeholder="Indiv grade" title="${hasComponents ? 'Calculated from [I_]-tagged assessment components' : 'Average individual grade (enter - for n/a)'}" value="${escapeHtml(hasComponents ? (m.indivGrade ?? '-') : (m.indivGrade ?? ''))}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'indivGrade', this.value.trim()===''?null:this.value.trim())" />
          <input type="text" inputmode="decimal" placeholder="Group grade" title="${hasComponents ? 'Calculated from [G_]-tagged assessment components' : 'Average group grade (enter - for n/a)'}" value="${escapeHtml(hasComponents ? (m.groupGrade ?? '-') : (m.groupGrade ?? ''))}" ${hasComponents ? 'disabled' : ''} onchange="updateField(${m.id},'groupGrade', this.value.trim()===''?null:this.value.trim())" />
        </div></td>` : ''}
      ${showExcl ? `<td class="col-excl"><input type="checkbox" ${m.excl ? 'checked' : ''} title="Exclude from average" onchange="updateField(${m.id},'excl',this.checked)" /></td>` : ''}
      ${showExcl ? `<td class="col-grademode"><input type="checkbox" ${m.gradeByModule ? 'checked' : ''} title="Enter this module's mark directly instead of calculating it from the assessment breakdown below" onchange="toggleGradeByModule(${m.id},this.checked)" /></td>` : ''}
      ${whatIfMode ? `<td class="col-whatif"><div class="whatif-cell">
          <input type="range" id="whatif-slider-${m.id}" min="0" max="100" step="0.5" value="${wiVal}"
            oninput="liveWhatIfUpdate(${m.id}, this.value)"
            onchange="applyWhatIfChange(${m.id}, this.value)" />
          <span id="whatif-val-${m.id}">${parseFloat(wiVal).toFixed(1)}%</span>
          ${whatIfOverrides.hasOwnProperty(m.id) ? `<button class="del-btn" title="Reset to actual mark" onclick="resetRowWhatIf(${m.id})">↺</button>` : ''}
        </div></td>` : ''}
      <td class="col-del"><button class="del-btn" onclick="deleteModule(${m.id})" title="Delete">×</button></td>
    </tr>${componentsPanelHtml}`;
  }).join('');

  const extraCols = 1 + (showAssignments ? 1 : 0) + (showSem ? 1 : 0) + (showPct ? 1 : 0) + (showExamCw ? 4 : 0); // credits + assignments + sem + pct + (exam% / cw% / pres% + their averages + indiv%/group% + their averages)
  const trailingCols = `${showExcl ? '<td></td><td></td>' : ''}${whatIfMode ? '<td></td>' : ''}<td></td>`; // excl + by-module + whatif + del
  let summaryRows = '';
  if (exclMods.length) {
    summaryRows += `<tr class="summary-row"><td></td><td>Average (incl. excluded: ${exclMods.map(m=>m.name).join(', ')})</td><td>${miniBar(parseFloat(avgRaw)||0)}</td><td class="col-mark" style="text-align:right">${avgRaw}%</td>${'<td></td>'.repeat(extraCols)}${trailingCols}</tr>`;
  }
  summaryRows += `<tr class="summary-row"><td></td><td>Running average${creditsFilled ? ' (credit-wtd)' : ''}</td><td>${miniBar(parseFloat(avgAll)||0)}</td><td class="col-mark" style="text-align:right">${avgAll}%</td>${'<td></td>'.repeat(extraCols)}${trailingCols}</tr>`;
  const weightedLabel = yc.avg !== null && yc.fraction < 1
    ? `Weighted contribution <span style="font-weight:400;opacity:0.75">(${(yc.fraction*100).toFixed(1)}% of year's credits marked)</span>`
    : 'Weighted contribution';
  summaryRows += `<tr class="weighted-row"><td></td><td>${weightedLabel}</td><td></td><td class="col-mark" style="text-align:right">${weighted}%</td>${'<td></td>'.repeat(extraCols)}${trailingCols}</tr>`;

  if (showExamCw) {
    const examYearAvg = moduleFieldAvg(year, 'examGrade', true);
    const cwYearAvg    = moduleFieldAvg(year, 'cwGrade', true);
    const presYearAvg  = moduleFieldAvg(year, 'presGrade', true);
    if (examYearAvg !== null || cwYearAvg !== null || presYearAvg !== null) {
      const examCwText = `${examYearAvg !== null ? examYearAvg.toFixed(2) + '% exam' : '— exam'} / ${cwYearAvg !== null ? cwYearAvg.toFixed(2) + '% cw' : '— cw'} / ${presYearAvg !== null ? presYearAvg.toFixed(2) + '% pres' : '— pres'}`;
      summaryRows += `<tr class="summary-row"><td></td><td>Average exam / coursework / presentation grade</td><td></td><td class="col-mark" style="text-align:right">${examCwText}</td>${'<td></td>'.repeat(extraCols)}${trailingCols}</tr>`;
    }
    const indivYearAvg = moduleFieldAvg(year, 'indivGrade', true);
    const groupYearAvg = moduleFieldAvg(year, 'groupGrade', true);
    if (indivYearAvg !== null || groupYearAvg !== null) {
      const indivGroupText = `${indivYearAvg !== null ? indivYearAvg.toFixed(2) + '% indiv' : '— indiv'} / ${groupYearAvg !== null ? groupYearAvg.toFixed(2) + '% group' : '— group'}`;
      summaryRows += `<tr class="summary-row"><td></td><td>Average individual / group grade</td><td></td><td class="col-mark" style="text-align:right">${indivGroupText}</td>${'<td></td>'.repeat(extraCols)}${trailingCols}</tr>`;
    }
  }

  let semBreakdownHtml = '';
  if (showSem && mods.length) {
    const sem1 = semesterAvg(year, 1, true, whatIfMode);
    const sem2 = semesterAvg(year, 2, true, whatIfMode);
    semBreakdownHtml = `
      <div class="sem-breakdown">
        <div class="sem-card">
          <div class="label">Semester 1 average</div>
          <div class="value" id="sem-avg-${year}-1">${sem1 !== null ? sem1.toFixed(2) + '%' : '—'}</div>
        </div>
        <div class="sem-card">
          <div class="label">Semester 2 average</div>
          <div class="value" id="sem-avg-${year}-2">${sem2 !== null ? sem2.toFixed(2) + '%' : '—'}</div>
        </div>
      </div>`;
  }

  const collapsed = !!state.collapsedYears[year];

  return `
    <div class="year-card">
      <div class="year-header">
        <button class="year-collapse-btn" onclick="toggleYearCollapse(${year})" title="${collapsed ? 'Expand' : 'Collapse'} ${yearLabel(year)}" aria-expanded="${!collapsed}">
          <span class="chevron ${collapsed ? 'is-collapsed' : ''}">▾</span>
        </button>
        <span class="year-title" onclick="toggleYearCollapse(${year})">${yearLabel(year)}</span>
        ${creditTallyHtml}
        ${collapsed ? `<span class="year-collapsed-summary">${yc.avg !== null ? `avg ${yc.avg.toFixed(2)}% · weighted ${weighted}%` : 'no marks yet'}</span>` : ''}
        <div class="year-weight-edit">
          <input type="number" value="${state.yearTotalCredits[year] || 120}" step="1" min="0"
            title="Total credits for this year"
            onchange="updateYearTotalCredits(${year}, parseInt(this.value)||120)" />
          <span>cr total</span>
        </div>
        <div class="year-weight-edit">
          <input type="number" value="${state.yearWeights[year]}" step="0.5" min="0" max="100"
            title="Degree weighting for this year"
            onchange="updateYearWeight(${year}, parseFloat(this.value)||0)" />
          <span>% of degree</span>
        </div>
        ${(() => {
          const allYears = getYears();
          const isLastYear = year === Math.max(...allYears);
          return isLastYear && allYears.length > 1
            ? `<button class="del-btn year-remove-btn" onclick="removeYear(${year})" title="Remove ${yearLabel(year)}${state.modules.some(m => m.year === year) ? ' and its modules' : ''}">×</button>`
            : '';
        })()}
      </div>
      <div id="year-body-${year}" ${collapsed ? 'style="display:none"' : ''}>
      <div style="overflow-x:auto" data-year-scroll="${year}">
      <table>
        <thead>
          <tr>
            <th class="col-order"></th>
            <th class="col-name">Module</th>
            <th class="col-bar"></th>
            <th class="col-mark">Running avg</th>
            <th class="col-credits">Credits</th>
            ${showAssignments ? '<th class="col-assign">Assignments</th>' : ''}
            ${showSem ? '<th class="col-sem">Semester</th>' : ''}
            ${showPct ? '<th class="col-pct">% done</th>' : ''}
            ${showExamCw ? `<th class="col-examcw-pct" title="Reference only, not used in any calculation">Exam % / CW % / Pres %</th>
            <th class="col-examcw-grade" title="Reference only, not used in any calculation">Avg exam / Avg CW / Avg pres</th>
            <th class="col-ig-pct" title="Reference only, not used in any calculation">Indiv % / Group %</th>
            <th class="col-ig-grade" title="Reference only, not used in any calculation">Avg indiv / Avg group</th>` : ''}
            ${showExcl ? '<th class="col-excl">Excl.</th>' : ''}
            ${showExcl ? '<th class="col-grademode">By module</th>' : ''}
            ${whatIfMode ? '<th class="col-whatif">What-if</th>' : ''}
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody>${rows}${summaryRows}</tbody>
      </table>
      </div>
      ${semBreakdownHtml}
      <div class="year-actions-row">
        <button class="add-btn" onclick="addModule(${year})">+ Add module to year ${year}</button>
        <button class="reset-order-btn" ${hasLockedModules ? '' : 'disabled'} onclick="resetModuleOrder(${year})" title="Return every module in this year to automatic ordering by semester then grade">Reset order</button>
      </div>
      </div>
    </div>`;
}

function render() {
  // years-container gets fully replaced below, which recreates each year's horizontal
  // scroll wrapper as a brand new DOM node - without this, scrollLeft snaps back to 0
  // on every render (e.g. after confirming a data entry), even though the person didn't
  // touch the scrollbar. Capture positions before replacing, restore after.
  const scrollPositions = {};
  document.querySelectorAll('[data-year-scroll]').forEach(el => {
    scrollPositions[el.dataset.yearScroll] = el.scrollLeft;
  });

  document.getElementById('years-container').innerHTML = getYears().map(renderYear).join('') + renderAddYearControl();
  renderSideCourses();
  renderSummary();
  renderWhatIfBanner();
  renderEmptyDataBanner();
  renderCharts();
  renderTranscript();
  renderSaveStatus();

  Object.keys(scrollPositions).forEach(year => {
    const el = document.querySelector(`[data-year-scroll="${year}"]`);
    if (el) el.scrollLeft = scrollPositions[year];
  });
}

function renderWhatIfBanner() {
  const btn = document.getElementById('whatif-toggle-btn');
  if (btn) btn.classList.toggle('active', whatIfMode);
  const wrap = document.getElementById('whatif-banner-wrap');
  if (!wrap) return;
  wrap.innerHTML = whatIfMode
    ? `<div class="whatif-banner">🎚 <strong>What-if mode is on</strong> — figures reflect hypothetical marks and nothing here is saved.
        <button onclick="resetWhatIf()">Reset what-if</button>
        <button onclick="toggleWhatIf()">Exit what-if</button>
      </div>`
    : '';
}

function toggleYearCollapse(year) {
  state.collapsedYears[year] = !state.collapsedYears[year];
  render();
  scheduleSave();
}

function toggleWhatIf() {
  whatIfMode = !whatIfMode;
  if (!whatIfMode) { whatIfOverrides = {}; whatIfComponentOverrides = {}; } // dropping back to real data clears any hypotheticals
  render();
}

function resetWhatIf() {
  whatIfOverrides = {};
  whatIfComponentOverrides = {};
  render();
}

function resetRowWhatIf(id) {
  delete whatIfOverrides[id];
  delete whatIfComponentOverrides[id]; // a module-level reset also clears any per-component hypotheses for it
  render();
}

// Pure, non-mutating twin of recomputeModuleFromComponents (see below), for the
// assignment-level what-if sliders: same weighted-average-of-graded-components logic,
// but layering hypothetical marks (componentOverrides, keyed by component id) over
// the module's real components instead of writing anything back to state. Returns
// null when there's nothing graded to average, same as recomputeModuleFromComponents's
// own "nothing graded" case, so callers can apply the same 0%-fallback convention.
function computeWhatIfModuleMark(mod, componentOverrides) {
  const comps = mod.components || [];
  if (!comps.length) return null;
  let gradedWeight = 0;
  let weightedSum = 0;
  comps.forEach(c => {
    const hasOverride = componentOverrides && componentOverrides.hasOwnProperty(c.id);
    const mark = hasOverride ? componentOverrides[c.id] : c.mark;
    if (mark === null || mark === undefined || mark === '' || isNaN(parseFloat(mark))) return;
    const w = parseFloat(c.weight) || 0;
    gradedWeight += w;
    weightedSum += w * parseFloat(mark);
  });
  if (gradedWeight <= 0) return null;
  return Math.round((weightedSum / gradedWeight) * 100) / 100;
}

// Shared by both the module-level and assignment-level what-if sliders: patches just
// the headline summary figures (cumulative average, marks collected, needed-for-First/
// 2:1, classification needle) from the current whatIfOverrides, without a full
// render() - keeps whichever slider is being dragged smooth mid-drag.
function patchWhatIfSummaryDom() {
  const { cumAvg, marksCollected, neededFirst, needed21 } = calcSummary(true);

  const cumEl = document.getElementById('cum-avg-value');
  if (cumEl) cumEl.textContent = cumAvg !== null ? cumAvg.toFixed(2) + '%' : '—';

  const subEl = document.getElementById('marks-collected-sub');
  if (subEl) subEl.textContent = `${marksCollected.toFixed(2)} / 100 marks collected`;

  const nfEl = document.getElementById('needed-first-value');
  if (nfEl) nfEl.textContent = neededFirst !== null ? neededFirst.toFixed(2) + '%' : '—';

  const nfCard = document.getElementById('needed-first-card');
  if (nfCard) nfCard.classList.toggle('good', neededFirst !== null && neededFirst <= 100);

  const n21El = document.getElementById('needed-21-value');
  if (n21El) n21El.textContent = needed21 !== null ? needed21.toFixed(2) + '%' : '—';

  const needle = document.getElementById('class-needle');
  if (needle) needle.style.left = Math.min(100, Math.max(0, cumAvg || 0)) + '%';
}

// Fires continuously while dragging a component's own what-if slider. Recomputes that
// module's hypothetical mark bottom-up from all its components (the real mark for
// every untouched one, the hypothetical for this one) and writes the result into
// whatIfOverrides, so the module-level slider/readout updates too - component sliders
// feed the module-level one, not the other way around. The module-level slider stays
// fully independent otherwise: dragging it directly still works exactly as before
// (see liveWhatIfUpdate/applyWhatIfChange) and never touches component overrides.
function liveComponentWhatIfUpdate(moduleId, componentId, value) {
  const v = parseFloat(value);
  if (!whatIfComponentOverrides[moduleId]) whatIfComponentOverrides[moduleId] = {};
  whatIfComponentOverrides[moduleId][componentId] = v;

  const label = document.getElementById(`whatif-comp-val-${moduleId}-${componentId}`);
  if (label) label.textContent = v.toFixed(1) + '%';

  const mod = state.modules.find(m => m.id === moduleId);
  if (!mod) return;
  const hypoMark = computeWhatIfModuleMark(mod, whatIfComponentOverrides[moduleId]);
  whatIfOverrides[moduleId] = hypoMark !== null ? hypoMark : 0;

  const slider = document.getElementById(`whatif-slider-${moduleId}`);
  if (slider) slider.value = whatIfOverrides[moduleId];
  const modLabel = document.getElementById(`whatif-val-${moduleId}`);
  if (modLabel) modLabel.textContent = whatIfOverrides[moduleId].toFixed(1) + '%';

  patchWhatIfSummaryDom();
}

// Fires once a component's what-if slider is released - same full re-render as the
// module-level applyWhatIfChange, so year averages, semester breakdowns and charts
// all catch up too, including the delete-component-override reset button appearing
// on this row now that an override exists.
function applyComponentWhatIfChange(moduleId, componentId, value) {
  const v = parseFloat(value);
  if (!whatIfComponentOverrides[moduleId]) whatIfComponentOverrides[moduleId] = {};
  whatIfComponentOverrides[moduleId][componentId] = v;

  const mod = state.modules.find(m => m.id === moduleId);
  if (mod) {
    const hypoMark = computeWhatIfModuleMark(mod, whatIfComponentOverrides[moduleId]);
    whatIfOverrides[moduleId] = hypoMark !== null ? hypoMark : 0;
  }
  render();
}

// Resets a single component's what-if hypothesis. If that was the module's last
// remaining component override, the module-level figure falls back to its real mark
// too, rather than being left showing a now-baseless hypothetical; otherwise the
// module-level mark is recomputed from whichever component overrides remain.
function resetComponentWhatIf(moduleId, componentId) {
  if (whatIfComponentOverrides[moduleId]) {
    delete whatIfComponentOverrides[moduleId][componentId];
    if (Object.keys(whatIfComponentOverrides[moduleId]).length === 0) {
      delete whatIfComponentOverrides[moduleId];
      delete whatIfOverrides[moduleId];
    } else {
      const mod = state.modules.find(m => m.id === moduleId);
      if (mod) {
        const hypoMark = computeWhatIfModuleMark(mod, whatIfComponentOverrides[moduleId]);
        whatIfOverrides[moduleId] = hypoMark !== null ? hypoMark : 0;
      }
    }
  }
  render();
}

// Fires continuously while dragging a what-if slider. Only touches the slider's own
// readout and the headline summary figures directly, so the slider itself is never
// replaced mid-drag (a full render() would interrupt the drag).
function liveWhatIfUpdate(id, value) {
  const v = parseFloat(value);
  whatIfOverrides[id] = v;

  const label = document.getElementById(`whatif-val-${id}`);
  if (label) label.textContent = v.toFixed(1) + '%';

  patchWhatIfSummaryDom();
}

// Fires once the slider is released. Does a full re-render so year averages,
// semester breakdowns and weighted contributions all catch up too.
function applyWhatIfChange(id, value) {
  whatIfOverrides[id] = parseFloat(value);
  render();
}

function updateField(id, field, value) {
  pushHistory();
  const mod = state.modules.find(m => m.id === id);
  if (mod) {
    mod[field] = value;
    // A module's manual reorder position only means something within the (year, sem)
    // group it was placed in when locked. Moving it to a different semester drops it
    // back into its new group's live, mark-based ordering rather than carrying over a
    // now-meaningless locked rank - it can always be re-pinned there by dragging it.
    if (field === 'sem') mod.orderLocked = false;
  }
  // A real edit always supersedes a leftover what-if slider value for this module.
  delete whatIfOverrides[id];
  render();
  scheduleSave();
}

// Feedback box: lives at the assignment (component) level, not the module level.
// Collapsed is just the default markup render() always produces (see the
// components-panel builder above), so no expand/collapse state needs tracking
// anywhere - clicking the label is a pure DOM swap, and saving on blur naturally
// triggers a render() that redraws the cell back into its collapsed shape, which
// is already correct by then since focus has already moved away.
function expandFeedback(labelEl) {
  const cell = labelEl.parentElement;
  const input = cell.querySelector('.feedback-input');
  labelEl.style.display = 'none';
  input.style.display = '';
  input.focus();
  // Place the cursor at the end of any existing text, rather than the start.
  const range = document.createRange();
  range.selectNodeContents(input);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function collapseComponentFeedback(inputEl, moduleId, componentId) {
  updateComponent(moduleId, componentId, 'feedback', inputEl.textContent.trim());
}

// Bulk-unlocks every module in a year, returning the whole year to fully dynamic
// ordering (semester, then mark descending) in one go - the same "let go" a single
// module gets from its own Semester dropdown change, just applied to every locked
// module in the year at once. Deliberately doesn't touch "Other courses": that list
// has no dynamic/locked concept at all (see commitSideCourseOrder), so there's
// nothing there to "reset" back to.
function resetModuleOrder(year) {
  const yearMods = state.modules.filter(m => m.year === year);
  if (!yearMods.some(m => m.orderLocked)) return; // nothing manually placed - no-op
  pushHistory();
  yearMods.forEach(m => { m.orderLocked = false; m.orderIndex = null; });
  render();
  scheduleSave();
}

// Switches a module between "calculated from its assessment breakdown" (the default)
// and "typed in directly". Ticking the box just flips the flag - whatever mark/%
// done/breakdown was last calculated stays put as a starting point, nothing is
// cleared. Unticking it (going back to by-assignment) is the one direction that
// needs extra work: the three recompute functions below all skip a module while
// gradeByModule is true (see their own guards), so any components edited while it
// was ticked never touched mod.mark/pct/etc - switching back off has to explicitly
// recompute right here, or the module would keep showing stale manually-typed figures
// until something else happened to trigger a recompute.
function toggleGradeByModule(id, checked) {
  pushHistory();
  const mod = state.modules.find(m => m.id === id);
  if (!mod) return;
  mod.gradeByModule = checked;
  if (!checked) {
    recomputeModuleFromComponents(mod);
    recomputeExamCwPresFromComponents(mod);
    recomputeIndivGroupFromComponents(mod);
  }
  delete whatIfOverrides[id];
  render();
  scheduleSave();
}

// Toggles a module's components between percentage weights and fraction weights
// (see the fraction-weights block above). Purely a display/entry-mode switch -
// c.weight (the percentage number every calculation actually reads) is never
// touched here, so switching modes back and forth never changes a module's mark.
// Switching INTO fraction mode seeds any component missing a fraction string from
// its current percentage (as a plain decimal, which is itself a valid fraction with
// an implicit denominator of 1), so nothing is silently lost - the person can then
// replace individual fields with real a/b syntax like "1/6" as they see fit.
function toggleWeightMode(moduleId) {
  pushHistory();
  const mod = state.modules.find(m => m.id === moduleId);
  if (!mod) return;
  mod.weightAsFraction = !mod.weightAsFraction;
  if (mod.weightAsFraction) {
    (mod.components || []).forEach(c => {
      if (c.weightFraction === undefined || c.weightFraction === null || c.weightFraction === '') {
        c.weightFraction = String(Math.round((c.weight || 0) * 10000) / 10000);
      }
    });
  }
  render();
  scheduleSave();
}

// Derives a module's Running avg and % done from its assessment components. Only
// components with a grade entered count as "graded": the mark is their weighted
// average, rounded to 2dp; % done is simply the total weight of the graded ones - it
// deliberately does NOT get normalized against 100 or against the sum of all entered
// weights, so a module that's only had its first 20%-weighted essay entered
// correctly shows 20% done, not 100%, even before every component has been added. If
// a module has no components at all yet, this does nothing, leaving whatever mark/%
// done was already there untouched - only once the first component is added does the
// module switch over to being calculated.
function recomputeModuleFromComponents(mod) {
  if (mod.gradeByModule) return; // manual override: keep whatever mark/% done was typed in directly, ignore components
  const comps = mod.components || [];
  if (!comps.length) return;
  const graded = comps.filter(c => c.mark !== null && c.mark !== undefined && c.mark !== '' && !isNaN(parseFloat(c.mark)));
  const gradedWeight = graded.reduce((a, c) => a + (parseFloat(c.weight) || 0), 0);
  mod.mark = gradedWeight > 0
    ? Math.round((graded.reduce((a, c) => a + (parseFloat(c.weight) || 0) * parseFloat(c.mark), 0) / gradedWeight) * 100) / 100
    : 0;
  mod.pct = Math.max(0, Math.min(100, Math.round(gradedWeight * 100) / 100));
}

// Reads a component's category (exam/coursework/presentation), stored directly on
// the component as comp.cat ('E'/'C'/'P'/null) and set via the checkboxes in the
// components panel, rather than parsed from a [XY] tag in the name. Untagged
// components don't count toward any of the three categories below, but still count
// toward the module's own mark/% done.
function componentCategory(comp) {
  return comp.cat || null;
}

// Reads the individual/group flag, stored directly on the component as comp.grp
// ('I'/'G'/null) - separate from the category above since these feed a completely
// different pair of columns.
function componentGroupType(comp) {
  return comp.grp || null;
}

// The components-panel disclaimer text: what's calculated automatically from the
// breakdown, uniformly across every year now.
function componentsDisclaimerText(m) {
  return 'Running avg, % done, and (with Advanced on) Exam/CW/Pres % and Indiv/Group %, plus their averages, are all calculated automatically from this breakdown.';
}

// Derives Exam %/CW %/Pres % and their average grades from the tagged components,
// the same "only touches modules that actually have components" gating as the mark/%
// done calculation above, uniformly across every year. Percentage is a plain sum of
// weightings (0 is a real, correct answer when nothing's tagged that way), but the
// average grade is null - shown as blank, the existing n/a convention for these text
// fields - whenever there's nothing graded to average, whether that's because
// nothing's tagged with that letter at all or because everything tagged with it is
// still ungraded; either way there's nothing to show.
function recomputeExamCwPresFromComponents(mod) {
  if (mod.gradeByModule) return; // manual override: keep whatever was typed in directly, ignore components
  const comps = mod.components || [];
  if (!comps.length) return;
  const cats = { E: { weight: 0, gradedWeight: 0, weightedSum: 0 }, C: { weight: 0, gradedWeight: 0, weightedSum: 0 }, P: { weight: 0, gradedWeight: 0, weightedSum: 0 } };
  comps.forEach(c => {
    const cat = componentCategory(c);
    if (!cat) return;
    const w = parseFloat(c.weight) || 0;
    cats[cat].weight += w;
    if (c.mark !== null && c.mark !== undefined && c.mark !== '' && !isNaN(parseFloat(c.mark))) {
      cats[cat].gradedWeight += w;
      cats[cat].weightedSum += w * parseFloat(c.mark);
    }
  });
  const pctOf = (cat) => Math.round(cats[cat].weight * 100) / 100;
  const avgOf = (cat) => cats[cat].gradedWeight > 0 ? Math.round((cats[cat].weightedSum / cats[cat].gradedWeight) * 100) / 100 : null;
  mod.examPct   = pctOf('E');
  mod.cwPct     = pctOf('C');
  mod.presPct   = pctOf('P');
  // '-' rather than null for "nothing to average" - this is the exact same convention
  // these text fields already use for manual n/a entries, so a calculated n/a reads
  // identically to a manually-typed one instead of looking like an unset blank field.
  mod.examGrade = avgOf('E') !== null ? String(avgOf('E')) : '-';
  mod.cwGrade   = avgOf('C') !== null ? String(avgOf('C')) : '-';
  mod.presGrade = avgOf('P') !== null ? String(avgOf('P')) : '-';
}

// Same idea as recomputeExamCwPresFromComponents, but keyed on the individual/group
// letter instead of the category letter - a separate pair of columns, sourced from
// the same tags, with identical 0%/"-" conventions, uniformly across every year.
function recomputeIndivGroupFromComponents(mod) {
  if (mod.gradeByModule) return; // manual override: keep whatever was typed in directly, ignore components
  const comps = mod.components || [];
  if (!comps.length) return;
  const groups = { I: { weight: 0, gradedWeight: 0, weightedSum: 0 }, G: { weight: 0, gradedWeight: 0, weightedSum: 0 } };
  comps.forEach(c => {
    const grp = componentGroupType(c);
    if (!grp) return;
    const w = parseFloat(c.weight) || 0;
    groups[grp].weight += w;
    if (c.mark !== null && c.mark !== undefined && c.mark !== '' && !isNaN(parseFloat(c.mark))) {
      groups[grp].gradedWeight += w;
      groups[grp].weightedSum += w * parseFloat(c.mark);
    }
  });
  const pctOf = (g) => Math.round(groups[g].weight * 100) / 100;
  const avgOf = (g) => groups[g].gradedWeight > 0 ? Math.round((groups[g].weightedSum / groups[g].gradedWeight) * 100) / 100 : null;
  mod.indivPct   = pctOf('I');
  mod.groupPct   = pctOf('G');
  mod.indivGrade = avgOf('I') !== null ? String(avgOf('I')) : '-';
  mod.groupGrade = avgOf('G') !== null ? String(avgOf('G')) : '-';
}

function toggleComponents(id) {
  if (expandedComponentModules.has(id)) expandedComponentModules.delete(id);
  else expandedComponentModules.add(id);
  render();
}

function addComponent(moduleId) {
  pushHistory();
  const mod = state.modules.find(m => m.id === moduleId);
  if (!mod) return;
  if (!Array.isArray(mod.components)) mod.components = [];
  mod.components.push({ id: state.nextComponentId++, name: 'New component', weight: 0, weightFraction: mod.weightAsFraction ? '0' : null, mark: null, feedback: '', cat: null, grp: null, sem: 0, _tagMigrated: true });
  expandedComponentModules.add(moduleId);
  recomputeModuleFromComponents(mod);
  recomputeExamCwPresFromComponents(mod);
  recomputeIndivGroupFromComponents(mod);
  delete whatIfOverrides[moduleId]; // the real mark may just have changed, so any stale hypothetical goes too
  delete whatIfComponentOverrides[moduleId];
  render();
  scheduleSave();
}

function deleteComponent(moduleId, componentId) {
  pushHistory();
  const mod = state.modules.find(m => m.id === moduleId);
  if (!mod) return;
  mod.components = (mod.components || []).filter(c => c.id !== componentId);
  if (mod.components.length === 0) {
    // The breakdown is now completely empty. This is deliberately NOT handled by
    // just calling the recompute functions below with an empty array: they're also
    // called by patchState on every single load, sweeping over every module
    // including the vast majority that have never touched the breakdown at all, and
    // there an empty array must leave real, manually-entered fields completely
    // alone (see their own "if (!comps.length) return" guards). This module just
    // lost its last component, which is a different situation - genuinely nothing
    // left to calculate from - so explicitly reset back to the same untouched
    // baseline addModule/patchState already use, but only if "By module" wasn't
    // ticked (a module in manual mode was never being driven by the breakdown in
    // the first place, so there's nothing of its to reset).
    if (!mod.gradeByModule) {
      mod.mark = 0;
      mod.pct = 0;
      mod.examPct = null;    mod.cwPct = null;    mod.presPct = null;
      mod.examGrade = null;  mod.cwGrade = null;   mod.presGrade = null;
      mod.indivPct = null;   mod.groupPct = null;
      mod.indivGrade = null; mod.groupGrade = null;
    }
  } else {
    recomputeModuleFromComponents(mod);
    recomputeExamCwPresFromComponents(mod);
    recomputeIndivGroupFromComponents(mod);
  }
  delete whatIfOverrides[moduleId];
  delete whatIfComponentOverrides[moduleId];
  render();
  scheduleSave();
}

function updateComponent(moduleId, componentId, field, value) {
  pushHistory();
  const mod = state.modules.find(m => m.id === moduleId);
  if (!mod) return;
  const comp = (mod.components || []).find(c => c.id === componentId);
  if (!comp) return;
  comp[field] = value;
  if (field === 'weightFraction') {
    // Fraction mode's text input writes here instead of 'weight' directly - derive
    // the percentage every calculation actually reads from the fraction typed in,
    // so recompute below sees the same kind of number it always has.
    const frac = parseFraction(value);
    comp.weight = frac ? fractionToPercent(frac) : 0;
  }
  recomputeModuleFromComponents(mod);
  recomputeExamCwPresFromComponents(mod);
  recomputeIndivGroupFromComponents(mod);
  delete whatIfOverrides[moduleId];
  delete whatIfComponentOverrides[moduleId];
  render();
  scheduleSave();
}

function updateYearWeight(year, value) {
  pushHistory();
  state.yearWeights[year] = value;
  render();
  scheduleSave();
}

function updateYearTotalCredits(year, value) {
  pushHistory();
  state.yearTotalCredits[year] = value;
  render();
  scheduleSave();
}

// Small control below the last year card, labeled with the year number it would add
// so it's clear what "+ Add Year" actually does before clicking it. Always appends at
// the highest number rather than inserting anywhere else - year numbers carry real
// meaning here (e.g. Year 1 specifically has no assessment-component breakdown), so
// there's no sensible way to "insert" a year in the middle without renumbering every
// module that comes after it.
function renderAddYearControl() {
  const years = getYears();
  const nextYear = years.length ? Math.max(...years) + 1 : 1;
  return `<div class="add-year-row"><button class="add-btn" onclick="addYear()">+ Add Year ${nextYear}</button></div>`;
}

// New year starts at 0% weight rather than guessing a split with existing years -
// there's no way to know how the person wants to redistribute, and stealing weight
// from other years silently would be worse than leaving it at 0 with a nudge to set
// it themselves via the existing "% of degree"/"cr total" inputs in the year header.
function addYear() {
  pushHistory();
  const years = getYears();
  const nextYear = years.length ? Math.max(...years) + 1 : 1;
  state.years = [...years, nextYear];
  state.yearWeights[nextYear] = 0;
  state.yearTotalCredits[nextYear] = 120;
  state.collapsedYears[nextYear] = false;
  render();
  scheduleSave();
  showToast(`Year ${nextYear} added — set its weight and credits`);
}

// Only ever removes the highest-numbered year (see renderYear's remove button, which
// only renders on the last year card) - same reasoning as addYear only appending:
// removing a middle year would mean renumbering every later year and every module in
// it, which is a much bigger and riskier change than "remove the year I just added by
// mistake" actually calls for. No confirm() dialog here, deliberately - this file can
// run inside an embedded preview where native modal dialogs are unreliable (the same
// issue print/pop-ups hit), so this follows deleteModule's existing pattern instead:
// act immediately, then say clearly in the toast that Undo puts it all back.
function removeYear(year) {
  const years = getYears();
  if (years.length <= 1) { showToast("Can't remove the only remaining year"); return; }
  if (year !== Math.max(...years)) return; // guards against a stale button reference; the UI never offers this for a non-last year
  pushHistory();
  const removedModules = state.modules.filter(m => m.year === year);
  state.modules = state.modules.filter(m => m.year !== year);
  state.years = years.filter(y => y !== year);
  delete state.yearWeights[year];
  delete state.yearTotalCredits[year];
  delete state.collapsedYears[year];
  removedModules.forEach(m => {
    delete whatIfOverrides[m.id];
    delete whatIfComponentOverrides[m.id];
    expandedComponentModules.delete(m.id);
  });
  render();
  scheduleSave();
  showToast(`Year ${year} removed${removedModules.length ? ` (and ${removedModules.length} module${removedModules.length === 1 ? '' : 's'})` : ''} — undo to restore`);
}

// --- Other courses (state.sideCourses) --------------------------------------
// Entirely separate from the degree tracker: own array, own id counters, and never
// read by yearAvg/yearContribution/calcSummary or any of the three sidebar charts -
// those all only ever look at state.modules. Nothing here has a year, credits, or a
// mark, since none of that applies to a course that isn't part of the degree. Each
// course's own components list (this section's equivalent of a module's assignment
// breakdown) is just a name and the same three-way status, deliberately simpler than
// a module's components - there's no weight/mark to average up, so nothing here ever
// needs to roll up into the course's own status the way component marks do.
const SIDE_COURSE_STATUS_OPTIONS = [
  ['not_started', 'Not started'],
  ['in_progress', 'In progress'],
  ['completed', 'Completed']
];

function sideCourseStatusSelect(cssClass, value, onchange) {
  return `<select class="${cssClass} status-${value}" onchange="${onchange}">
      ${SIDE_COURSE_STATUS_OPTIONS.map(([val, label]) => `<option value="${val}" ${value === val ? 'selected' : ''}>${label}</option>`).join('')}
    </select>`;
}

// Part-level "Type" - a fixed dropdown, not free text, per explicit spec: blank/default
// plus seven named categories (Quiz added later - kept between Review and Exam, matching
// the order the person listed colours in, not alphabetical). '' is a real, intentional
// option (the default/blank state), not a missing value - keep it first in the list so
// it's always the top/default entry. Third tuple element is a CSS-safe colour slug used
// by sideCoursePartTypeSelect below to colour-code the closed select, same mechanism as
// SIDE_COURSE_STATUS_OPTIONS/sideCourseStatusSelect's status-${value} classes.
const SIDE_COURSE_PART_TYPE_OPTIONS = [
  ['', '', ''],
  ['Theory', 'Theory', 'theory'],
  ['Workshop', 'Workshop', 'workshop'],
  ['Lab', 'Lab', 'lab'],
  ['Review', 'Review', 'review'],
  ['Quiz', 'Quiz', 'quiz'],
  ['Exam', 'Exam', 'exam'],
  ['Certification Project', 'Certification Project', 'cert']
];

function sideCoursePartTypeSelect(value, onchange) {
  // title reflects the current selection so the full label is always available on hover,
  // even once the fixed-width closed select has visually truncated a long one like
  // "Certification Project" - see the CSS note above for why the width is fixed at all.
  const entry = SIDE_COURSE_PART_TYPE_OPTIONS.find(([val]) => val === value) || SIDE_COURSE_PART_TYPE_OPTIONS[0];
  const [, label, slug] = entry;
  // No colour class at all for the blank/default option - it stays visually neutral,
  // matching how the status select's 'not_started' state also carries no border-color
  // override, just the base select styling.
  const colorClass = slug ? ` type-${slug}` : '';
  return `<select class="side-course-type${colorClass}" title="Type: ${escapeHtml(label || '(none)')}" onchange="${onchange}">
      ${SIDE_COURSE_PART_TYPE_OPTIONS.map(([val, label]) => `<option value="${escapeHtml(val)}" ${value === val ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}
    </select>`;
}

// A course's own progress is derived entirely from its parts, never set directly (see
// updateSideCourse - nothing calls it with field 'status' anymore, the dropdown that
// used to do that is gone from renderSideCourses below). Rules: no parts yet, or every
// part still 'not_started' -> not_started. Every part 'completed' -> completed.
// Anything else - any part 'in_progress', or a mix of completed and not_started with
// nothing explicitly in progress - counts as in_progress, since the course is clearly
// neither untouched nor finished either way.
function deriveSideCourseStatus(course) {
  const comps = course.components || [];
  if (!comps.length) return 'not_started';
  if (comps.every(c => c.status === 'completed')) return 'completed';
  if (comps.every(c => c.status === 'not_started')) return 'not_started';
  return 'in_progress';
}

// Read-only replacement for the course-level select: same status colouring via the
// shared status-${value} class, but no onchange - the only way to move a course's
// status now is to change what its parts are doing.
function sideCourseStatusBadge(value) {
  const label = (SIDE_COURSE_STATUS_OPTIONS.find(([val]) => val === value) || SIDE_COURSE_STATUS_OPTIONS[0])[1];
  return `<span class="side-course-status side-course-status-badge status-${value}" title="Derived from this course's parts">${label}</span>`;
}

function addSideCourse() {
  pushHistory();
  state.sideCourses.push({ id: state.nextSideCourseId++, name: 'New course', status: 'not_started', components: [], folderId: null, steps: '-', pocEnabled: false, poc: null });
  render();
  scheduleSave();
}

function updateSideCourse(id, field, value) {
  pushHistory();
  const c = state.sideCourses.find(c => c.id === id);
  if (c) c[field] = value;
  render();
  scheduleSave();
}

function deleteSideCourse(id) {
  pushHistory();
  state.sideCourses = state.sideCourses.filter(c => c.id !== id);
  expandedSideCourses.delete(id);
  render();
  scheduleSave();
  showToast('Course deleted — undo to restore');
}

// Folders are purely organisational (see the section comment above the drag
// machinery) - grouping only, never read by any calculation.
function addSideCourseFolder() {
  pushHistory();
  const id = state.nextSideCourseFolderId++;
  state.sideCourseFolders.push({ id, name: 'New folder' });
  expandedFolders.add(id); // matches addSideCourseComponent's auto-expand of what was just created
  render();
  scheduleSave();
}

function updateSideCourseFolder(id, field, value) {
  pushHistory();
  const f = state.sideCourseFolders.find(f => f.id === id);
  if (f) f[field] = value;
  render();
  scheduleSave();
}

function deleteSideCourseFolder(id) {
  pushHistory();
  // Deleting a folder never deletes the courses inside it - they fall back to the
  // ungrouped root list, since a folder is just a grouping label, not a container
  // courses should be able to vanish along with.
  state.sideCourses.forEach(c => { if (c.folderId === id) c.folderId = null; });
  state.sideCourseFolders = state.sideCourseFolders.filter(f => f.id !== id);
  expandedFolders.delete(id);
  render();
  scheduleSave();
  showToast('Folder deleted, its courses moved to Other courses — undo to restore');
}

function toggleSideCourseFolder(id) {
  if (expandedFolders.has(id)) expandedFolders.delete(id);
  else expandedFolders.add(id);
  render();
}

function toggleSideCourseComponents(id) {
  if (expandedSideCourses.has(id)) expandedSideCourses.delete(id);
  else expandedSideCourses.add(id);
  render();
}

function addSideCourseComponent(courseId) {
  pushHistory();
  const c = state.sideCourses.find(c => c.id === courseId);
  if (!c) return;
  if (!Array.isArray(c.components)) c.components = [];
  c.components.push({ id: state.nextSideCourseComponentId++, name: 'New component', status: 'not_started', steps: '-', type: '', poc: null });
  c.status = deriveSideCourseStatus(c);
  expandedSideCourses.add(courseId);
  render();
  scheduleSave();
}

function updateSideCourseComponent(courseId, componentId, field, value) {
  pushHistory();
  const c = state.sideCourses.find(c => c.id === courseId);
  const comp = c && (c.components || []).find(comp => comp.id === componentId);
  if (comp) comp[field] = value;
  if (c) c.status = deriveSideCourseStatus(c);
  render();
  scheduleSave();
}

function deleteSideCourseComponent(courseId, componentId) {
  pushHistory();
  const c = state.sideCourses.find(c => c.id === courseId);
  if (!c) return;
  c.components = (c.components || []).filter(comp => comp.id !== componentId);
  c.status = deriveSideCourseStatus(c);
  render();
  scheduleSave();
}

// Proof of completion: one PNG/JPG image per row (Course row or one of its Part rows),
// gated entirely by the parent course's own pocEnabled checkbox - a part never gets its own
// checkbox, see renderSideCourseItem/pocWidget below. Stored as a base64 data URL directly
// on the course/component object, same as every other field, so it travels with Export/
// Import automatically. There's no server for a single static HTML file to upload to, so a
// data URL is the only real option - the trade-off is that a chunky screenshot meaningfully
// bloats both the saved and exported JSON. POC_MAX_BYTES is a soft cap only: going over it
// never blocks the attachment, it's still read and saved in full, just with a one-off toast
// so the person notices before a much bigger export file surprises them later.
const POC_MAX_BYTES = 1024 * 1024; // 1MB, per file

// Set just before opening the one shared hidden file input (#poc-file-input), so
// handlePocFileSelected knows which row triggered it once the browser's file dialog
// resolves. partId is null for a course-level upload, a component id for a part-level one.
let pocUploadTarget = null;

function triggerPocUpload(courseId, partId) {
  pocUploadTarget = { courseId, partId };
  document.getElementById('poc-file-input').click();
}

function handlePocFileSelected(file) {
  const target = pocUploadTarget;
  pocUploadTarget = null;
  if (!file || !target) return;
  if (file.type !== 'image/png' && file.type !== 'image/jpeg') {
    showToast('Proof of completion must be a PNG or JPG image');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const poc = { dataUrl: reader.result, name: file.name, size: file.size };
    // updateSideCourse/updateSideCourseComponent already handle pushHistory, saving the
    // course's derived status, render() and scheduleSave() - the same generic setters
    // every other field on these rows goes through, 'poc' is nothing special to them.
    if (target.partId === null) updateSideCourse(target.courseId, 'poc', poc);
    else updateSideCourseComponent(target.courseId, target.partId, 'poc', poc);
    showToast(file.size > POC_MAX_BYTES
      ? `Attached (${Math.round(file.size / 1024)}KB) - over the ${Math.round(POC_MAX_BYTES / 1024)}KB soft limit, so Export will be bigger too`
      : 'Proof of completion attached');
  };
  reader.onerror = () => showToast('Could not read that file');
  reader.readAsDataURL(file);
}

// Shared widget for both the Course-level and Part-level Proof of Completion cell: an
// Upload button when nothing's attached yet, or a small clickable thumbnail (opens an
// in-page lightbox at full size, see openPocLightbox), filename, and a remove button once
// something is. Only ever called when the parent course's pocEnabled is true - see
// renderSideCourseItem, which is also where the "no column at all when disabled" half of
// the gating actually happens.
function pocWidget(courseId, partId, poc) {
  if (!poc) {
    return `<button class="poc-upload-btn" onclick="triggerPocUpload(${courseId},${partId === null ? 'null' : partId})" title="Attach a PNG or JPG certificate/screenshot">Upload</button>`;
  }
  const removeCall = partId === null
    ? `updateSideCourse(${courseId},'poc',null)`
    : `updateSideCourseComponent(${courseId},${partId},'poc',null)`;
  return `<div class="poc-widget">
      <img class="poc-thumb" src="${poc.dataUrl}" alt="Proof of completion" title="${escapeHtml(poc.name)} - click to view full size" onclick="openPocLightbox(this.src)" />
      <span class="poc-filename" title="${escapeHtml(poc.name)}">${escapeHtml(poc.name)}</span>
      <button class="poc-remove-btn" onclick="${removeCall}" title="Remove proof of completion">×</button>
    </div>`;
}

// Column labels for the Course level (sits above a folder's list of courses, or above the
// root/ungrouped list) and the Part level (sits above one course's list of parts, when
// expanded). Structurally these are the same flex row as the real data row they label,
// with inert same-class spacers standing in for the drag handle / toggle button / delete

}

function sideCoursePartColumnHeaderRow(pocEnabled) {

    <div class="side-course-header-row side-course-component-header-row">
      <span class="drag-handle">⠿</span>
      <div class="side-course-header-name">Part Title</div>
      <div class="side-course-header-steps">Steps</div>

// One course's row + its own components panel - factored out of renderSideCourses
// since it now needs to render in two places: inside a folder body, and inside the
// ungrouped root list.
function renderSideCourseItem(c) {
  const comps = c.components || [];
  const isExpanded = expandedSideCourses.has(c.id);

  const compRows = comps.map((comp, ci) => `
    <div class="side-course-component-row" data-drag-id="${comp.id}">
      ${dragHandleHtml(`startCourseComponentDrag(event,${c.id},${comp.id})`)}
      <div class="name-input" contenteditable="true" spellcheck="false" onblur="updateSideCourseComponent(${c.id},${comp.id},'name',this.textContent.trim())">${escapeHtml(comp.name)}</div>
      <input type="text" class="side-course-steps" value="${escapeHtml(comp.steps ?? '-')}" placeholder="Steps" title="Steps" onchange="updateSideCourseComponent(${c.id},${comp.id},'steps',this.value.trim())" />
      ${sideCoursePartTypeSelect(comp.type ?? '', `updateSideCourseComponent(${c.id},${comp.id},'type',this.value)`)}
      ${c.pocEnabled ? `<div class="side-course-poc">${pocWidget(c.id, comp.id, comp.poc)}</div>` : ''}

      <button class="del-btn" onclick="deleteSideCourseComponent(${c.id},${comp.id})" title="Delete component">×</button>
    </div>`).join('');

  const componentsPanel = isExpanded ? `
    <div class="side-course-components-panel">
      ${comps.length ? sideCoursePartColumnHeaderRow(c.pocEnabled) + compRows : '<div class="side-course-components-empty">No components added yet.</div>'}
      <button class="add-btn" onclick="addSideCourseComponent(${c.id})">+ Add component</button>
    </div>` : '';

  return `
    <div class="side-course-item" data-drag-id="${c.id}">
      <div class="side-course-row-main">
        ${dragHandleHtml(`startCourseDrag(event,${c.id},${c.folderId ?? 'null'})`, 'Drag to reorder or move into a folder')}
        <button class="assign-toggle-btn side-course-toggle-btn side-course-row-toggle-btn" onclick="toggleSideCourseComponents(${c.id})" title="Components breakdown for this course">
          <span class="chevron ${isExpanded ? '' : 'is-collapsed'}">▾</span> ${comps.length ? comps.length + ' part' + (comps.length > 1 ? 's' : '') : 'Breakdown'}
        </button>
        <div class="name-input side-course-name" contenteditable="true" spellcheck="false" onblur="updateSideCourse(${c.id},'name',this.textContent.trim())">${escapeHtml(c.name)}</div>
        <input type="text" class="side-course-steps" value="${escapeHtml(c.steps ?? '-')}" placeholder="Steps" title="Steps" onchange="updateSideCourse(${c.id},'steps',this.value.trim())" />
        <div class="side-course-poc">

        </div>
        ${sideCourseStatusBadge(c.status)}
        <button class="del-btn" onclick="deleteSideCourse(${c.id})" title="Delete course">×</button>
      </div>
      ${componentsPanel}
    </div>`;
}

function renderSideCourses() {
  const container = document.getElementById('side-courses-container');
  if (!container) return;

  const folderBlocks = state.sideCourseFolders.map(f => {
    const isExpanded = expandedFolders.has(f.id);
    const coursesInFolder = state.sideCourses.filter(c => c.folderId === f.id);
    const body = isExpanded ? `
      <div class="side-course-folder-body" data-folder-id="${f.id}">
        ${coursesInFolder.length ? sideCourseColumnHeaderRow() + coursesInFolder.map(renderSideCourseItem).join('') : '<div class="side-course-folder-empty">Drag a course in here.</div>'}
      </div>` : '';

    return `
      <div class="side-course-folder" data-drag-id="${f.id}" data-folder-id="${f.id}">
        <div class="side-course-folder-header">
          ${dragHandleHtml(`startFolderDrag(event,${f.id})`, 'Drag to reorder folders')}
          <button class="assign-toggle-btn side-course-toggle-btn" onclick="toggleSideCourseFolder(${f.id})" title="${isExpanded ? 'Collapse' : 'Expand'} folder">
            <span class="chevron ${isExpanded ? '' : 'is-collapsed'}">▾</span> 📁 ${coursesInFolder.length} course${coursesInFolder.length === 1 ? '' : 's'}
          </button>
          <div class="name-input side-course-folder-name" contenteditable="true" spellcheck="false" onblur="updateSideCourseFolder(${f.id},'name',this.textContent.trim())">${escapeHtml(f.name)}</div>
          <button class="del-btn" onclick="deleteSideCourseFolder(${f.id})" title="Delete folder (courses move to Other courses, not deleted)">×</button>
        </div>
        ${body}
      </div>`;
  }).join('');

  const rootCourses = state.sideCourses.filter(c => (c.folderId ?? null) === null);
  const rootList = `
    <div class="side-course-root-list" data-folder-id="root">
      ${rootCourses.length ? sideCourseColumnHeaderRow() + rootCourses.map(renderSideCourseItem).join('')
        : (state.sideCourseFolders.length ? '<div class="side-course-folder-empty">Drag a course here to take it out of a folder.</div>' : '')}
    </div>`;

  const hasAnything = state.sideCourseFolders.length || state.sideCourses.length;
  const totalCourses = state.sideCourses.length;

  const bodyHtml = `
    ${hasAnything ? `<div class="side-course-list">${folderBlocks}${rootList}</div>` : '<div class="chart-card-empty">No courses added yet.</div>'}
    <div class="side-course-actions-row">
      <button class="add-btn" onclick="addSideCourse()">+ Add course</button>
      <button class="add-btn" onclick="addSideCourseFolder()">+ Add folder</button>
    </div>`;

  container.innerHTML = `
    <div class="chart-card">
      <div class="chart-card-header">
        <button class="section-collapse-btn" onclick="toggleOtherCoursesCollapse()" title="${otherCoursesCollapsed ? 'Expand' : 'Collapse'} Other courses" aria-expanded="${!otherCoursesCollapsed}">
          <span class="chevron ${otherCoursesCollapsed ? 'is-collapsed' : ''}">▾</span>

          <div class="chart-card-title">Other courses</div>
          <div class="chart-card-subtitle">Tracked separately - doesn't count toward your degree average</div>
        </div>
        ${otherCoursesCollapsed ? `<span class="year-collapsed-summary">${totalCourses} course${totalCourses === 1 ? '' : 's'}</span>` : ''}
      </div>
      <div id="other-courses-body" ${otherCoursesCollapsed ? 'style="display:none"' : ''}>${bodyHtml}</div>
    </div>`;
}


function deleteModule(id) {

  delete whatIfComponentOverrides[id];

function addModule(year) {
  pushHistory();
  // "By module" now defaults unticked for every year uniformly, same as Semester
  // defaulting to Sem 1 - Year 1 no longer has any special-cased defaults (it used to,
  // temporarily, while its assignment records were still incomplete).
  state.modules.push({ id: state.nextId++, year, name: 'New module', mark: 0, pct: 0, excl: false, credits: 0, sem: 1, orderLocked: false, orderIndex: null, examPct: null, cwPct: null, presPct: null, examGrade: null, cwGrade: null, presGrade: null, indivPct: null, groupPct: null, indivGrade: null, groupGrade: null, gradeByModule: false, _gradeModeMigrated: true });

function scheduleSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveData, 1000);
