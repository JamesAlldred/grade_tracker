  document.body.classList.add('drag-active');
  window.addEventListener('pointermove', handleCourseDragMove);
  window.addEventListener('pointerup', handleCourseDragEnd, { once: true });
  window.addEventListener('pointercancel', handleCourseDragCancel, { once: true });
}

// Which drop-target folder (or null for the ungrouped root) the pointer currently
// sits over, purely by Y position against the rects snapshotted at drag start.
// Falls back to the drag's own origin container if the pointer isn't over any
// target (e.g. dragged above the very top or below the very bottom of the whole
// list) - which correctly resolves to a same-container reorder rather than a move.
function hoveredCourseDropFolderId(clientY) {
  const hit = courseDragState.dropTargets.find(t => clientY >= t.rect.top && clientY <= t.rect.bottom);
  return hit ? hit.folderId : courseDragState.originFolderId;
}

// Same-container insertion index, computed the same way as the generic system's
// dragInsertionIndex: how many other siblings (by their drag-start midpoint) the
// pointer currently sits below.
function courseDragInsertionIndex(clientY) {
  let count = 0;
  courseDragState.originSiblingEls.forEach((el, i) => {
    if (courseDragState.originOrderedIds[i] === courseDragState.id) return;
    const rect = courseDragState.originRects[i];
    if (rect.top + rect.height / 2 < clientY) count++;
  });
  return count;
}

function updateCourseDragHighlight(insertionIndex) {
  const restIds = courseDragState.originOrderedIds.filter(oid => oid !== courseDragState.id);
  const beforeId = restIds[insertionIndex];
  if (beforeId !== undefined) {
    courseDragState.originSiblingEls[courseDragState.originOrderedIds.indexOf(beforeId)]?.classList.add('drag-target-above');
  } else if (restIds.length) {
    const afterId = restIds[restIds.length - 1];
    courseDragState.originSiblingEls[courseDragState.originOrderedIds.indexOf(afterId)]?.classList.add('drag-target-below');
  }
}

function handleCourseDragMove(e) {
  if (!courseDragState) return;
  courseDragState.rowEl.style.transform = `translateY(${e.clientY - courseDragState.startClientY}px)`;
  courseDragState.originSiblingEls.forEach(el => el.classList.remove('drag-target-above', 'drag-target-below'));
  document.querySelectorAll('.side-course-folder.drop-target, .side-course-root-list.drop-target')
    .forEach(el => el.classList.remove('drop-target'));

  const hoveredFolderId = hoveredCourseDropFolderId(e.clientY);
  if (hoveredFolderId === courseDragState.originFolderId) {
    updateCourseDragHighlight(courseDragInsertionIndex(e.clientY));
  } else {
    // Hovering a different container: highlight it as a whole rather than a precise
    // position within it - the course lands at the end of that container's list on
    // drop (see handleCourseDragEnd), fine positioning is a follow-up same-container
    // drag once it's there.
    const targetEl = hoveredFolderId == null
      ? document.querySelector('.side-course-root-list')
      : document.querySelector(`.side-course-folder[data-folder-id="${hoveredFolderId}"]`);
    targetEl?.classList.add('drop-target');
  }
}

function cleanupCourseDragVisuals() {
  window.removeEventListener('pointermove', handleCourseDragMove);
  document.body.classList.remove('drag-active');
  document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  if (!courseDragState) return;
  courseDragState.rowEl.classList.remove('dragging');
  courseDragState.rowEl.style.transform = '';
  courseDragState.originSiblingEls.forEach(el => el.classList.remove('drag-target-above', 'drag-target-below'));
}

function handleCourseDragEnd(e) {
  if (!courseDragState) return;
  const hoveredFolderId = hoveredCourseDropFolderId(e.clientY);
  const { id, originFolderId, originOrderedIds } = courseDragState;

  if (hoveredFolderId === originFolderId) {
    // Dropped back in its own container: identical reorder behaviour to the
    // generic system, just scoped to this one folder's (or the root's) courses.
    const restIds = originOrderedIds.filter(oid => oid !== id);
    restIds.splice(courseDragInsertionIndex(e.clientY), 0, id);
    const changed = JSON.stringify(restIds) !== JSON.stringify(originOrderedIds);
    cleanupCourseDragVisuals();
    courseDragState = null;
    if (changed) commitSideCourseOrder(restIds, originFolderId);
  } else {
    cleanupCourseDragVisuals();
    courseDragState = null;
    moveSideCourseToFolder(id, hoveredFolderId);
  }
}

function handleCourseDragCancel() {
  cleanupCourseDragVisuals();
  courseDragState = null;
}

// Reassigns a course to a different folder (or back to the root list with null),
// appending it at the very end of the whole array so it lands last within its new
// group too - rendering buckets courses by folderId while preserving array order,
// so "last in the array" is always "last in whichever group it's now part of".
function moveSideCourseToFolder(id, targetFolderId) {
  const c = state.sideCourses.find(c => c.id === id);
  if (!c || (c.folderId ?? null) === (targetFolderId ?? null)) return;
  pushHistory();
  c.folderId = targetFolderId;
  state.sideCourses = state.sideCourses.filter(cc => cc.id !== id).concat(c);
  render();
  scheduleSave();
}

// Folders themselves reorder among each other using the plain generic beginDrag
// system - unlike courses, a folder can only ever move relative to other folders,
// never nest inside one or merge into the root list, so it doesn't need any of the
// cross-container machinery above.
function startFolderDrag(e, id) {
  const row = e.currentTarget.closest('.side-course-folder');
  const container = document.getElementById('side-courses-container');
  if (!row || !container) return;
  const siblingEls = Array.from(container.querySelectorAll('.side-course-folder'));
  beginDrag(e, id, row, siblingEls, orderedIds => commitSideCourseFolderOrder(orderedIds));
}

function startComponentDrag(e, moduleId, componentId) {
  const row = e.currentTarget.closest('tr');
  const tbody = row ? row.closest('table.components-table')?.querySelector('tbody') : null;
  if (!row || !tbody) return;
  const siblingEls = Array.from(tbody.querySelectorAll('tr'));
  beginDrag(e, componentId, row, siblingEls, orderedIds => commitComponentOrder(moduleId, orderedIds));
}

function startCourseComponentDrag(e, courseId, componentId) {
  const row = e.currentTarget.closest('.side-course-component-row');
  const panel = row ? row.closest('.side-course-components-panel') : null;
  if (!row || !panel) return;
  const siblingEls = Array.from(panel.querySelectorAll('.side-course-component-row'));
  beginDrag(e, componentId, row, siblingEls, orderedIds => commitSideCourseComponentOrder(courseId, orderedIds));
}

// --- Commit functions: apply a dropped-into order back to state ------------------

// Commits an explicit final order for one (year, sem) group: locks every module in
// that group and gives each a fresh sequential orderIndex matching the given order.
// A drop repositions a module relative to EVERY sibling in the group at once (unlike
// the old single-step arrows this replaced), so - unlike a single arrow move - a
// drop locks the WHOLE group into that exact order, not just the item that moved.
// Sequential integers rather than interpolated values, deliberately: the old
// interpolation scheme could compute a new rank that landed exactly on an existing
// tied value, silently swallowing the move - sequential integers can't collide.
// Reset order (below) still unlocks the whole year back to dynamic ordering at once.
// orderIndex is assigned in REVERSE (top of orderedIds gets the highest number):
// moduleEffectiveRank feeds a descending sort (higher rank = sorts first), the same
// convention an unlocked module's own mark already uses, so the first id in
// orderedIds needs the highest orderIndex to actually end up first.
function commitModuleOrder(year, sem, orderedIds) {
  pushHistory();
  const n = orderedIds.length;
  orderedIds.forEach((id, i) => {
    const m = state.modules.find(mm => mm.id === id);
    if (m) { m.orderLocked = true; m.orderIndex = n - 1 - i; }
  });
  render();
  scheduleSave();
}

// Reorders courses within ONE group (a specific folder, or the root list when
// folderId is null) to match orderedIds, leaving every course in a different group
// exactly where it was in the flat array. Rendering re-buckets courses by folderId
// on every render regardless of interleaving, so only the relative order WITHIN the
// affected group actually needs to change here.
function commitSideCourseOrder(orderedIds, folderId) {
  pushHistory();
  const byId = new Map(state.sideCourses.map(c => [c.id, c]));
  const reordered = orderedIds.map(id => byId.get(id)).filter(Boolean);
  let idx = 0;
  state.sideCourses = state.sideCourses.map(c => {
    if ((c.folderId ?? null) !== (folderId ?? null)) return c;
    return reordered[idx++];
  });
  render();
  scheduleSave();
}

function commitSideCourseFolderOrder(orderedIds) {
  pushHistory();
  const byId = new Map(state.sideCourseFolders.map(f => [f.id, f]));
  state.sideCourseFolders = orderedIds.map(id => byId.get(id)).filter(Boolean);
  render();
  scheduleSave();
}

function commitComponentOrder(moduleId, orderedIds) {
  const mod = state.modules.find(m => m.id === moduleId);
  if (!mod || !Array.isArray(mod.components)) return;
  pushHistory();
  const byId = new Map(mod.components.map(c => [c.id, c]));
  mod.components = orderedIds.map(id => byId.get(id)).filter(Boolean);
  render();
  scheduleSave();
}

function commitSideCourseComponentOrder(courseId, orderedIds) {
  const course = state.sideCourses.find(c => c.id === courseId);
  if (!course || !Array.isArray(course.components)) return;
  pushHistory();
  const byId = new Map(course.components.map(c => [c.id, c]));
  course.components = orderedIds.map(id => byId.get(id)).filter(Boolean);
  render();
  scheduleSave();
}

// --- Charts sidebar -------------------------------------------------------
// Built with plain SVG rather than a charting library. Chart.js needed a CDN
// script, and the sandboxed frame this tracker can run in (e.g. an artifact
// preview) blocks that even when the person's own connection is fine - so a
// zero-dependency chart is the more reliable choice here, and matches the
// tracker's existing "single file, no build step" philosophy. SVG also picks
// up theme colors automatically via CSS variables in each element's `style`,
// so unlike the canvas version this needs no re-render on theme toggle.

// Every module, ordered by year, then semester, then mark descending within that
// group (Year 1 has no semester, so its modules just sort by mark within the year).
// A pure function deliberately kept separate from the SVG-building code below,
// so the grouping/ordering logic can be checked on its own.
function buildGradeDistributionData() {
  if (!state) return [];
  return state.modules
    .slice()
    .sort((a, b) => {
      if (a.year !== b.year) return a.year - b.year;
      const semA = a.sem || 0, semB = b.sem || 0;
      if (semA !== semB) return semA - semB;
      return b.mark - a.mark;
    })
    .map(m => ({ label: m.name, year: m.year, sem: m.sem, mark: m.mark, excl: !!m.excl }));
}

function bandColorVarForMark(v) {
  if (v >= 70) return 'var(--grade-first)';
  if (v >= 60) return 'var(--grade-21)';
  if (v >= 50) return 'var(--grade-22)';
  if (v >= 40) return 'var(--grade-third)';
  return 'var(--grade-fail)';
}

function renderCharts() {
  const container = document.getElementById('charts-container');
  if (!container) return;
  if (!container.dataset.built) {
    container.innerHTML = `
      <div class="chart-card">

        <div class="chart-card-subtitle">Every module, by year and semester, highest mark first</div>

          <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-21)"></span>2:1 (60–69%)</div>
          <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-22)"></span>2:2 (50–59%)</div>
          <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-third)"></span>3rd (40–49%)</div>
          <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-fail)"></span>Fail (&lt;40%)</div>
        </div>
        <div class="chart-card-canvas-wrap" id="chart-grade-distribution-wrap"></div>
        <div class="chart-card-empty" id="chart-grade-distribution-empty" style="display:none"></div>
      </div>

        <div class="chart-card-title">Course completion</div>
        <div class="chart-card-subtitle">Share of the degree marked so far, by year</div>
        <div id="chart-completion-wrap"></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Degree marks acquired</div>

        <div id="chart-marks-wrap"></div>
      </div>

        <div class="chart-card-title">Assignment grades by category</div>
        <div class="chart-card-subtitle">Every graded, tagged assignment, split by Exam/Coursework/Presentation then Individual/Group</div>
        <div class="chart-legend" id="chart-assignment-spread-year-legend"></div>
        <div class="chart-card-canvas-wrap" id="chart-assignment-spread-wrap"></div>

      </div>

function renderGradeDistributionChart() {
  const wrap = document.getElementById('chart-grade-distribution-wrap');
  const emptyEl = document.getElementById('chart-grade-distribution-empty');
  if (!wrap) return;

  const items = buildGradeDistributionData();
  if (!items.length) {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    if (emptyEl) { emptyEl.style.display = 'block'; emptyEl.textContent = 'Add some modules to see your grade distribution.'; }
    return;
  }
  wrap.style.display = 'block';
  if (emptyEl) emptyEl.style.display = 'none';

  // Layout in SVG user units. Bar width/gap give every module enough room that
  // labels don't collapse into each other - the wrapper scrolls horizontally
  // once the total width exceeds the sidebar, same idea as the module tables.
  const barWidth = 22, gap = 14;
  const yearGapExtra = 16; // extra breathing room where one year's bars end and the next begin
  const semGapExtra  = 8;  // a smaller nudge between semesters within the same year
  const leftMargin = 34, rightMargin = 10, topMargin = 26, bottomMargin = 80;
  const plotHeight = 150;

  // Positions are worked out up front (rather than a flat index * width) so the extra
  // gaps at group boundaries land in the right place, and the divider lines/year labels
  // can be derived from the exact same x values the bars themselves end up using.
  let x = leftMargin;
  const yearDividers = [];
  const semDividers = [];
  const yearLabelRanges = [];
  let groupStart = null;

  items.forEach((it, i) => {
    const prev = items[i - 1];
    if (prev && prev.year !== it.year) {
      x += yearGapExtra;
      yearDividers.push(x - yearGapExtra / 2);
      if (groupStart !== null) yearLabelRanges.push({ year: prev.year, xStart: groupStart, xEnd: prev._barX + barWidth });
      groupStart = null;
    } else if (prev && prev.year === it.year && (prev.sem || 0) !== (it.sem || 0)) {
      x += semGapExtra;
      semDividers.push(x - semGapExtra / 2);
    }
    if (groupStart === null) groupStart = x;
    it._barX = x;
    x += barWidth + gap;
  });
  const lastItem = items[items.length - 1];
  yearLabelRanges.push({ year: lastItem.year, xStart: groupStart, xEnd: lastItem._barX + barWidth });

  const width = x - gap + rightMargin;
  const height = topMargin + plotHeight + bottomMargin;

  const gridLines = [0, 20, 40, 60, 80, 100].map(v => {
    const y = topMargin + plotHeight - (v / 100) * plotHeight;
    return `<line x1="${leftMargin}" y1="${y}" x2="${width - rightMargin}" y2="${y}" style="stroke:var(--divider)" stroke-width="1" />
      <text x="${leftMargin - 6}" y="${y + 3}" text-anchor="end" font-size="9" style="fill:var(--text-3)">${v}%</text>`;
  }).join('');

  // Semester dividers are a light dashed line within the plot area only; year dividers
  // run a little taller, up into the label row, so the grouping reads clearly without
  // either one competing visually with the bars themselves.
  const dividerLines = [
    ...semDividers.map(dx => `<line x1="${dx}" y1="${topMargin}" x2="${dx}" y2="${topMargin + plotHeight}" style="stroke:var(--divider)" stroke-width="1" stroke-dasharray="2,3" />`),
    ...yearDividers.map(dx => `<line x1="${dx}" y1="${topMargin - 12}" x2="${dx}" y2="${topMargin + plotHeight}" style="stroke:var(--card-border)" stroke-width="1" />`)
  ].join('');

  const yearLabels = yearLabelRanges.map(r => {
    const labelX = (r.xStart + r.xEnd) / 2;
    return `<text x="${labelX}" y="${topMargin - 14}" text-anchor="middle" font-size="9" font-weight="600" style="fill:var(--text-3)">${escapeHtml(yearLabel(r.year).replace(' year', ''))}</text>`;
  }).join('');

  const bars = items.map((it) => {
    const barX = it._barX;
    const barH = Math.max(0, (Math.min(100, it.mark) / 100) * plotHeight);
    const y = topMargin + plotHeight - barH;
    const fadeAttr = it.excl ? ' fill-opacity="0.35"' : '';
    const tooltip = `${escapeHtml(it.label)}: ${it.mark}%${it.excl ? ' (excluded from average)' : ''}`;
    const labelX = barX + barWidth / 2;
    const labelY = topMargin + plotHeight + 12;
    return `<g>
        <rect x="${barX}" y="${y}" width="${barWidth}" height="${barH}" rx="3" style="fill:${bandColorVarForMark(it.mark)}"${fadeAttr}><title>${tooltip}</title></rect>
        <text x="${labelX}" y="${labelY}" text-anchor="end" font-size="9" style="fill:var(--text-3)" transform="rotate(-55 ${labelX} ${labelY})">${escapeHtml(it.label)}</text>
      </g>`;
  }).join('');

  wrap.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">${gridLines}${dividerLines}${yearLabels}${bars}</svg>`;
}

// Maps each year to a distinct, theme-aware color, kept separate from the classification
// band colors above since this chart is about years, not grades.
const YEAR_COLORS = { 1: 'var(--year1)', 2: 'var(--year2)', 3: 'var(--year3)', 4: 'var(--year4)', 5: 'var(--year5)', 6: 'var(--year6)', 7: 'var(--year7)', 8: 'var(--year8)' };
// Falls back to a neutral gray beyond the predefined palette (year 9+), same
// "don't crash, just degrade gracefully" approach as yearLabel above.
function yearColor(year) {
  return YEAR_COLORS[year] || 'var(--text-3)';
}

// One ring, split into 4 wedges sized by each year's weight in the degree (6/19/37.5/37.5,
// summing to 360 degrees). Within each wedge, the "done" portion uses the exact same
// fraction yearContribution() already uses elsewhere in the app (credits entered x % done,
// against that year's total credit target) - so this always tracks the real numbers, it
// doesn't hardcode which years are finished. Right now that fraction happens to be 1 for
// Years 1 and 2 because you've entered full credits and 100% done on all their modules.
// A pure function, kept separate from the SVG-drawing code below, so the angle maths can
// be checked on its own.
function buildCompletionData() {
  if (!state) return { years: [], totalPct: 0 };
  let angleCursor = 0;
  let totalWeightShare = 0;
  const years = getYears().map(year => {
    const weight = state.yearWeights[year] || 0;
    const segmentAngle = (weight / 100) * 360;
    // What-if sliders only ever hypothesize marks, never credits or % done, so they can't
    // affect completion - false here is a deliberate constant, not an oversight.
    const yc = yearContribution(year, false);
    const fraction = Math.max(0, Math.min(1, yc.fraction || 0));
    const startAngle = angleCursor;
    const endAngle = startAngle + segmentAngle;
    angleCursor = endAngle;
    totalWeightShare += yc.weightShare;
    return { year, weight, fraction, startAngle, endAngle, doneAngle: startAngle + segmentAngle * fraction };
  });
  return { years, totalPct: totalWeightShare * 100 };
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

// Builds an SVG path for one annular (donut) wedge, from startAngle to endAngle degrees,
// measured clockwise from the top. Standard "outer arc, line in, inner arc back, close" shape.
function donutWedgePath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const a0 = Math.min(startAngle, endAngle);
  let a1 = Math.max(startAngle, endAngle);
  if (a1 - a0 <= 0.0001) return '';
  if (a1 - a0 >= 359.999) a1 = a0 + 359.999; // avoid a degenerate flag on a full circle
  const largeArcFlag = (a1 - a0) > 180 ? 1 : 0;
  const outerStart = polarToCartesian(cx, cy, rOuter, a1);
  const outerEnd   = polarToCartesian(cx, cy, rOuter, a0);
  const innerEnd   = polarToCartesian(cx, cy, rInner, a0);
  const innerStart = polarToCartesian(cx, cy, rInner, a1);
  return [
    'M', outerStart.x.toFixed(2), outerStart.y.toFixed(2),
    'A', rOuter, rOuter, 0, largeArcFlag, 0, outerEnd.x.toFixed(2), outerEnd.y.toFixed(2),
    'L', innerEnd.x.toFixed(2), innerEnd.y.toFixed(2),
    'A', rInner, rInner, 0, largeArcFlag, 1, innerStart.x.toFixed(2), innerStart.y.toFixed(2),
    'Z'
  ].join(' ');
}

function renderCompletionChart() {
  const wrap = document.getElementById('chart-completion-wrap');
  if (!wrap) return;
  if (!state) { wrap.innerHTML = ''; return; }

  const { years, totalPct } = buildCompletionData();
  const cx = 80, cy = 80, rOuter = 72, rInner = 44;

  const wedges = years.map(y => {
    const color = yearColor(y.year);
    const bgPath = donutWedgePath(cx, cy, rOuter, rInner, y.startAngle, y.endAngle);
    const donePath = y.fraction > 0 ? donutWedgePath(cx, cy, rOuter, rInner, y.startAngle, y.doneAngle) : '';
    return `
      <path d="${bgPath}" style="fill:${color}" fill-opacity="0.16" stroke="var(--card-bg)" stroke-width="1.5"><title>Year ${y.year}: ${y.weight}% of the degree</title></path>
      ${donePath ? `<path d="${donePath}" style="fill:${color}" stroke="var(--card-bg)" stroke-width="1.5"><title>Year ${y.year}: ${(y.fraction * 100).toFixed(1)}% marked so far</title></path>` : ''}
    `;
  }).join('');

  const legend = years.map(y => `
    <div class="chart-legend-item">
      <span class="chart-legend-dot" style="background:${yearColor(y.year)}"></span>
      ${yearLabel(y.year)} <span class="completion-legend-weight">${y.weight}%</span>
      <span class="completion-legend-pct">${y.fraction >= 1 ? 'done' : (y.fraction * 100).toFixed(0) + '% done'}</span>
    </div>
  `).join('');

  wrap.innerHTML = `
    <div class="completion-chart-row">
      <svg viewBox="0 0 160 160" width="160" height="160" xmlns="http://www.w3.org/2000/svg">
        ${wedges}
        <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="22" font-weight="600" style="fill:var(--text-1)">${totalPct.toFixed(0)}%</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="9" style="fill:var(--text-3)">of degree marked</text>
      </svg>
      <div class="completion-legend">${legend}</div>
    </div>
  `;
}

// --- Degree marks acquired --------------------------------------------------
// Same ring geometry and year colors as the completion donut above (identical
// segment boundaries, since both are sized by year weight), but the filled portion
// here represents actual marks earned rather than raw completion. Every number is
// pulled straight from calcSummary()/yearContribution() - the same functions that
// already drive the "Overall progress" cards - rather than recalculated here, so
// this can never drift out of sync with the rest of the page.
function buildMarksAcquiredData() {
  if (!state) return { years: [], totalPct: 0, neededFirst: null, needed21: null };
  const summary = calcSummary(false); // what-if is a hypothetical, not an acquired mark - deliberately false
  let angleCursor = 0;
  const years = getYears().map(year => {
    const weight = state.yearWeights[year] || 0;
    const segmentAngle = (weight / 100) * 360;
    const yc = yearContribution(year, false);
    const startAngle = angleCursor;
    const endAngle = startAngle + segmentAngle;
    angleCursor = endAngle;
    // yc.points is already in "percentage points of the whole degree" units, so
    // 1 point = 3.6 degrees of the full ring; clamped defensively to stay inside
    // this year's own segment.
    const filledAngle = Math.max(startAngle, Math.min(endAngle, startAngle + (yc.points / 100) * 360));
    return { year, weight, points: yc.points, startAngle, endAngle, filledAngle };
  });
  return { years, totalPct: summary.marksCollected, neededFirst: summary.neededFirst, needed21: summary.needed21 };
}

function renderMarksAcquiredChart() {
  const wrap = document.getElementById('chart-marks-wrap');
  if (!wrap) return;
  if (!state) { wrap.innerHTML = ''; return; }

  const { years, totalPct, neededFirst, needed21 } = buildMarksAcquiredData();
  const cx = 80, cy = 80, rOuter = 72, rInner = 44;

  const wedges = years.map(y => {
    const color = yearColor(y.year);
    const bgPath = donutWedgePath(cx, cy, rOuter, rInner, y.startAngle, y.endAngle);
    const filledPath = y.filledAngle > y.startAngle ? donutWedgePath(cx, cy, rOuter, rInner, y.startAngle, y.filledAngle) : '';
    return `
      <path d="${bgPath}" style="fill:${color}" fill-opacity="0.16" stroke="var(--card-bg)" stroke-width="1.5"><title>Year ${y.year}: ${y.weight}% available</title></path>
      ${filledPath ? `<path d="${filledPath}" style="fill:${color}" stroke="var(--card-bg)" stroke-width="1.5"><title>Year ${y.year}: ${y.points.toFixed(2)}% acquired</title></path>` : ''}
    `;
  }).join('');

  const legend = years.map(y => `
    <div class="chart-legend-item">
      <span class="chart-legend-dot" style="background:${yearColor(y.year)}"></span>
      ${yearLabel(y.year)} <span class="completion-legend-weight">out of ${y.weight}%</span>
      <span class="completion-legend-pct">${y.points.toFixed(2)}%</span>
    </div>
  `).join('');

  const nfGood = neededFirst !== null && neededFirst <= 100;
  const n21Good = needed21 !== null && needed21 <= 100;

  wrap.innerHTML = `
    <div class="completion-chart-row">
      <svg viewBox="0 0 160 160" width="160" height="160" xmlns="http://www.w3.org/2000/svg">
        ${wedges}
        <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="19" font-weight="600" style="fill:var(--text-1)">${totalPct.toFixed(2)}%</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="9" style="fill:var(--text-3)">marks acquired</text>
      </svg>
      <div class="completion-legend">${legend}</div>
    </div>
    <div class="chart-stats">
      <div class="chart-stat-row">
        <span class="chart-stat-label">Current weighted total</span>
        <span class="chart-stat-value hi">${totalPct.toFixed(2)}%</span>
      </div>
      <div class="chart-stat-row">
        <span class="chart-stat-label">Needed for a First (70%)</span>
        <span class="chart-stat-value${nfGood ? ' good' : ''}">${neededFirst !== null ? neededFirst.toFixed(2) + '%' : '—'}</span>
      </div>
      <div class="chart-stat-row">
        <span class="chart-stat-label">Needed for a 2:1 (60%)</span>
        <span class="chart-stat-value${n21Good ? ' good' : ''}">${needed21 !== null ? needed21.toFixed(2) + '%' : '—'}</span>
      </div>
    </div>
  `;
}

// --- Assignment grades by category (E/C/P) chart ---------------------------
// Unlike the three charts above, this one is sourced fresh from each module's
// components array on every call, not from the pre-calculated examPct/cwPct/presPct
// fields - those only ever hold aggregated averages, and the whole point here is to
// show every individual assignment's own mark. Untagged components (componentCategory
// returns null) and ungraded ones (mark missing/blank/non-numeric) are skipped
// entirely rather than plotted as a blank/zero point, and Year 1 is skipped since it
// has no components at all, consistent with the Assignments panel elsewhere.
// Nested by category then individual/group, since both are now x-axis sections
// (Exam/Coursework/Presentation, each split into Individual/Group) rather than a
// visual (color/shape) encoding.
function buildAssignmentSpreadData() {
  const out = { E: { I: [], G: [] }, C: { I: [], G: [] }, P: { I: [], G: [] } };
  if (!state) return out;
  state.modules.forEach(m => {
    // Manual-entry modules (By module ticked) don't use their components at all, so
    // those components are dormant here too - uniformly across every year.
    if (m.gradeByModule) return;
    (m.components || []).forEach(c => {
      const cat = componentCategory(c);
      const grp = componentGroupType(c);
      // Both dimensions are independent checkboxes now (not one atomic [XY] tag), so
      // either can be set without the other - a component only plots here once both
      // are ticked, same "don't show it as a blank/zero point" treatment as an
      // untagged or ungraded component gets.
      if (!cat || !grp) return;
      if (c.mark === null || c.mark === undefined || c.mark === '' || isNaN(parseFloat(c.mark))) return;
      out[cat][grp].push({
        mark: parseFloat(c.mark),
        year: m.year,
        label: c.name,
        moduleName: m.name,
        feedback: c.feedback || ''
      });
    });
  });
  return out;
}

// Simple deterministic beeswarm: points are tried at the column center first, then
// alternating steps left/right, until one is found that doesn't sit within minGapPx
// of an already-placed point on both axes - so points with similar marks fan out
// instead of overlapping, while points far apart in mark stack straight down the
// centerline. Offsets are clamped to maxOffset so a crowded column still fans out
// within its own swim-lane rather than colliding with its neighbors. Expects items
// pre-sorted by yPx (ascending) so nearby marks get resolved in a stable order.
function beeswarmOffsets(items, minGapPx, maxOffset) {
  const placed = [];
  items.forEach(it => {
    let offset = 0;
    let tries = 0;
    while (
      placed.some(p => Math.abs(p.yPx - it.yPx) < minGapPx && Math.abs(p.offset - offset) < minGapPx) &&
      tries < 40
    ) {
      tries++;
      const step = Math.ceil(tries / 2) * minGapPx;
      offset = (tries % 2 === 0) ? -step : step;
    }
    offset = Math.max(-maxOffset, Math.min(maxOffset, offset));
    it.offset = offset;
    placed.push({ yPx: it.yPx, offset });
  });
  return items;
}

// Every point is now a plain circle - category (Exam/Coursework/Presentation) and
// individual/group are both x-axis sections (see renderAssignmentSpreadChart), so
// neither needs a visual encoding of its own any more. Year is the one dimension
// that isn't already positional, so it takes the fill, using the same YEAR_COLORS
// already used elsewhere in the app (module rows, the year donut, etc.), so a
// Year 3 point reads the same "year 3" color here as it does anywhere else. The
// thin card-background stroke is purely for edge definition against the gridlines
// behind it, not a fourth encoded dimension.
function assignmentPointMarker(cx, cy, year, tooltip) {
  const fillVar = yearColor(year);
  return `<circle cx="${cx}" cy="${cy}" r="4.5" style="fill:${fillVar};stroke:var(--card-bg)" stroke-width="1.25" fill-opacity="0.92"><title>${tooltip}</title></circle>`;
}

function renderAssignmentSpreadChart() {
  const wrap = document.getElementById('chart-assignment-spread-wrap');
  const emptyEl = document.getElementById('chart-assignment-spread-empty');
  if (!wrap) return;

  const data = buildAssignmentSpreadData();
  const CATS = [
    { key: 'E', label: 'Exam' },
    { key: 'C', label: 'Coursework' },
    { key: 'P', label: 'Presentation' }
  ];
  const GROUPS = [
    { key: 'I', label: 'Ind' },
    { key: 'G', label: 'Grp' }
  ];

  const total = CATS.reduce((a, cat) => a + GROUPS.reduce((b, grp) => b + data[cat.key][grp.key].length, 0), 0);
  const yearLegendEl = document.getElementById('chart-assignment-spread-year-legend');
  if (!total) {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    if (emptyEl) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Tick a category and individual/group box for a component, then enter a grade, to see it here.';
    }
    if (yearLegendEl) yearLegendEl.innerHTML = '';
    return;
  }
  wrap.style.display = 'block';
  if (emptyEl) emptyEl.style.display = 'none';

  // Legend now just lists the years actually present, as solid year-colored dots -
  // that's the only dimension left that isn't already an axis section, so it's the
  // only thing left needing a legend at all. Only lists years with data (just Year 2
  // right now), growing on its own as Year 3/4 get tagged and graded.
  if (yearLegendEl) {
    const yearsPresent = new Set();
    CATS.forEach(cat => GROUPS.forEach(grp => data[cat.key][grp.key].forEach(it => yearsPresent.add(it.year))));
    const sortedYears = Array.from(yearsPresent).sort((a, b) => a - b);
    yearLegendEl.innerHTML = sortedYears.map(y =>
      `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${yearColor(y)}"></span>Year ${y}</div>`
    ).join('');
  }

  // Two-level x-axis: three category sections (Exam/Coursework/Presentation), each
  // itself split into two sub-sections (Individual/Group) - the same "divide the axis
  // into sections, no color needed" approach used for category alone before, just
  // applied a second time within each category. bottomMargin is taller than a
  // single-level axis needs, to fit both the category label and the sub-section
  // labels beneath it.
  const leftMargin = 34, rightMargin = 10, topMargin = 26, bottomMargin = 40;
  const plotHeight = 150;
  const subColumnWidth = 62;
  const columnWidth = subColumnWidth * GROUPS.length;
  const width = leftMargin + columnWidth * CATS.length + rightMargin;
  const height = topMargin + plotHeight + bottomMargin;

  const gridLines = [0, 20, 40, 60, 80, 100].map(v => {
    const y = topMargin + plotHeight - (v / 100) * plotHeight;
    return `<line x1="${leftMargin}" y1="${y}" x2="${width - rightMargin}" y2="${y}" style="stroke:var(--divider)" stroke-width="1" />
      <text x="${leftMargin - 6}" y="${y + 3}" text-anchor="end" font-size="9" style="fill:var(--text-3)">${v}%</text>`;
  }).join('');

  let dividers = '', labels = '', points = '';

  CATS.forEach((catDef, ci) => {
    const catX = leftMargin + columnWidth * ci;
    const catCenterX = catX + columnWidth / 2;
    if (ci > 0) {
      dividers += `<line x1="${catX}" y1="${topMargin}" x2="${catX}" y2="${topMargin + plotHeight}" style="stroke:var(--divider)" stroke-width="1" stroke-dasharray="2,3" />`;
    }
    labels += `<text x="${catCenterX}" y="${topMargin + plotHeight + 16}" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--text-2)">${catDef.label}</text>`;

    GROUPS.forEach((grpDef, gi) => {
      const subX = catX + subColumnWidth * gi;
      const subCenterX = subX + subColumnWidth / 2;
      // Lighter/finer dashing than the category divider, so the hierarchy (category
      // boundary vs. individual/group boundary within it) reads at a glance.
      if (gi > 0) {
        dividers += `<line x1="${subX}" y1="${topMargin}" x2="${subX}" y2="${topMargin + plotHeight}" style="stroke:var(--divider)" stroke-width="1" stroke-dasharray="1,4" stroke-opacity="0.6" />`;
      }
      labels += `<text x="${subCenterX}" y="${topMargin + plotHeight + 29}" text-anchor="middle" font-size="8.5" style="fill:var(--text-3)">${grpDef.label}</text>`;

      const items = data[catDef.key][grpDef.key]
        .map(d => ({ ...d, yPx: topMargin + plotHeight - (Math.max(0, Math.min(100, d.mark)) / 100) * plotHeight }))
        .sort((a, b) => a.yPx - b.yPx);
      beeswarmOffsets(items, 9, subColumnWidth / 2 - 8);

      items.forEach(it => {
        const cx = subCenterX + it.offset;
        const tooltip = `${escapeHtml(it.label)} (${escapeHtml(it.moduleName)}, Year ${it.year}): ${it.mark}%, ${grpDef.key === 'G' ? 'Group' : 'Individual'}${it.feedback ? `, Feedback: ${escapeHtml(it.feedback)}` : ''}`;
        points += assignmentPointMarker(cx, it.yPx, it.year, tooltip);
      });
    });
  });

  wrap.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">${gridLines}${dividers}${labels}${points}</svg>`;
}

// --- Semester comparison charts (radar + diverging benchmark) --------------
// Shared by both charts below. Built from individual assignments (module
// components), not whole modules, so a module split across several assessments
// shows each one's own performance rather than a single blended number.
//
// Semester attribution:
//   - A module set to Semester 1 or 2: EVERY one of its assignments goes to
//     that semester, regardless of that assignment's own semester tag - the
//     module's own dropdown decides. This matches how an assignment's own sem
//     field is only ever meaningful when the module itself is Full Year
//     elsewhere in this file (see semesterAvg) - it's not a second vote here.
//   - A Full Year module (sem 0): an assignment individually tagged Semester 1
//     or 2 goes there; an assignment left untagged (sem 0), or a Full Year
//     module with no breakdown at all, is a genuinely full-year assignment and
//     goes in the third `fullYear` bucket - it's not ambiguous the way it
//     would be for the other two buckets, there's simply nothing to split.
//     Only the radar chart currently reads this bucket (see
//     renderSemesterRadarChart) - the benchmark chart still only destructures
//     sem1/sem2, so it's unaffected by this bucket existing.
//   - A module with no real assignment breakdown (gradeByModule ticked, or no
//     components entered at all) falls back to ONE point using the module's
//     own overall mark, attributed with the same rules above (treating "the
//     whole module" as its one assignment).
// An assignment with no mark entered is excluded, matching how buildAssignmentSpreadData
// already decides "is this graded" elsewhere in the file.
function buildSemesterAssignmentData(year) {
  if (!state) return { sem1: [], sem2: [], fullYear: [] };
  const sem1 = [], sem2 = [], fullYear = [];

  state.modules.forEach(m => {
    if (year !== 'all' && m.year !== year) return;
    const hasComponents = !m.gradeByModule && (m.components || []).length > 0;

    if (!hasComponents) {
      if (!(m.pct > 0)) return; // nothing graded at all for this module
      // No components exist for this module, so there's no assignment-level
      // feedback to surface here - feedback only lives on components now.
      const item = { label: m.name, mark: m.mark, excl: !!m.excl, year: m.year, moduleName: m.name, isWholeModule: true, feedback: '' };
      if (m.sem === 1) sem1.push(item);
      else if (m.sem === 2) sem2.push(item);
      else if (m.sem === 0) fullYear.push(item);
      return;
    }

    m.components.forEach(c => {
      const mark = parseFloat(c.mark);
      if (c.mark === null || c.mark === undefined || c.mark === '' || isNaN(mark)) return;
      const item = { label: c.name, mark, excl: !!m.excl, year: m.year, moduleName: m.name, isWholeModule: false, feedback: c.feedback || '' };
      if (m.sem === 1) sem1.push(item);
      else if (m.sem === 2) sem2.push(item);
      else if (m.sem === 0) {
        if (c.sem === 1) sem1.push(item);
        else if (c.sem === 2) sem2.push(item);
        else fullYear.push(item); // c.sem 0/unset: genuinely a full-year assignment, not an ambiguous case
      }
    });
  });

  sem1.sort((a, b) => b.mark - a.mark);
  sem2.sort((a, b) => b.mark - a.mark);
  fullYear.sort((a, b) => b.mark - a.mark);
  return { sem1, sem2, fullYear };
}

// Maps a mark onto a radius between rInner (40%) and rOuter (100%), continuing the
// SAME linear scale below 40 rather than clamping there - an assignment at 5% needs
// to visibly plunge much closer to the centre than one at 38%, or the "spot outliers"
// goal these charts exist for is defeated by flattening every low score to look
// the same. Clamped only at a small positive minimum so a very low mark still
// renders as a real (if tiny) point rather than an inverted/negative radius.
function radialScaleR(mark, rInner, rOuter) {
  const slope = (rOuter - rInner) / (100 - 40);
  return Math.max(2, rInner + (mark - 40) * slope);
}

function truncateLabel(text, maxLen) {
  return text.length > maxLen ? text.slice(0, maxLen - 1) + '…' : text;
}

// Shared hover-tooltip text for one assignment-level item, used by both charts.
// Assignment names are deliberately never printed as permanent chart text (see
// the section comment on the benchmark chart below) - this is the one place
// identity is surfaced, on hover, with enough context (which module, which
// assignment) to actually be useful once there are many small data points.
function semItemTooltip(it) {
  const base = it.isWholeModule ? `${it.label}: ${it.mark}%` : `${it.moduleName} — ${it.label}: ${it.mark}%`;
  return base + (it.excl ? ' (excluded from average)' : '') + (it.feedback ? ` (Feedback: ${it.feedback})` : '');
}

// Builds the small Overall / Y1 / Y2 ... segmented control shared by both charts
// below - view is 'all' or a year number, kept as plain runtime state (not saved,
// not undo-tracked, same category as expandedSideCourses) so it always starts
// back on "Overall" on reload, same as every other view-only toggle in the file.
function semChartViewTabs(currentView, setterName) {
  const options = ['all', ...getYears()];
  return `<div class="chart-view-tabs">${options.map(v => {
    const active = currentView === v;
    const label = v === 'all' ? 'Overall' : `Y${v}`;
    const arg = v === 'all' ? "'all'" : v;
    return `<button class="chart-view-tab ${active ? 'active' : ''}" onclick="${setterName}(${arg})">${label}</button>`;
  }).join('')}</div>`;
}

let semRadarView = 'all';
function setSemRadarView(view) {
  semRadarView = view;
  renderSemesterRadarChart(); // a view switch is pure UI state - redraw just this chart, no full render() needed
}

// Radar/spider chart: Semester 1, Semester 2, and Full Year assignments each
// plotted as their own overlapping polygon over N "assignment slots", N being
// the largest of the three groups' assignment counts for the current view.
// Each group's own assignments are sorted by mark descending and placed on
// slots 1..(its own count) - a group with fewer assignments simply forms a
// smaller polygon touching fewer of the axes, rather than padding out missing
// slots with fabricated zero-value points. "Full Year" here means an
// assignment that belongs to a Full Year module and isn't itself tagged to
// either semester (see buildSemesterAssignmentData) - genuinely spans the
// whole year, not a guess at which semester it "really" belongs to.
function renderSemesterRadarChart() {
  const wrap = document.getElementById('chart-sem-radar-wrap');
  if (!wrap || !state) return;

  const tabs = semChartViewTabs(semRadarView, 'setSemRadarView');
  const { sem1, sem2, fullYear } = buildSemesterAssignmentData(semRadarView);
  const n = Math.max(sem1.length, sem2.length, fullYear.length);

  if (n === 0) {
    wrap.innerHTML = `${tabs}<div class="chart-card-empty">No graded Semester 1, Semester 2, or full year assignments ${semRadarView === 'all' ? 'yet' : 'for this year yet'}.</div>`;
    return;
  }

  const cx = 150, cy = 150, rInner = 18, rOuter = 108;
  const ringMarks = [40, 55, 70, 85, 100];

  const rings = ringMarks.map(m => {
    const r = radialScaleR(m, rInner, rOuter);
    const isThreshold = m === 70; // the prominent First-Class boundary reference line
    return `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" fill="none" style="stroke:${isThreshold ? 'var(--green-text)' : 'var(--divider)'}" stroke-width="${isThreshold ? 1.6 : 1}" ${isThreshold ? 'stroke-dasharray="5,4"' : ''} />`;
  }).join('');
  // Ring value labels run up the 12-o'clock spoke only, not repeated at every
  // axis, so they read as a shared radial scale rather than cluttering every slot.
  const ringLabels = ringMarks.map(m => {
    const r = radialScaleR(m, rInner, rOuter);
    return `<text x="${cx + 4}" y="${(cy - r + 3).toFixed(2)}" font-size="8" style="fill:var(--text-3)">${m}%</text>`;
  }).join('');

  let spokes = '', axisMarkers = '';
  for (let i = 0; i < n; i++) {
    const angle = i * (360 / n);
    const edge = polarToCartesian(cx, cy, rOuter, angle);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${edge.x.toFixed(2)}" y2="${edge.y.toFixed(2)}" style="stroke:var(--divider)" stroke-width="1" />`;
    // A slot can hold up to two assignments (one from each semester, independently
    // ranked within its own polygon) - the marker's tooltip lists whichever of the
    // two actually land here, rather than naming just one and silently dropping
    // the other.
    const markerPos = polarToCartesian(cx, cy, rOuter + 10, angle);
    const here = [sem1[i], sem2[i], fullYear[i]].filter(Boolean).map(semItemTooltip).join(' / ');
    axisMarkers += `<circle cx="${markerPos.x.toFixed(2)}" cy="${markerPos.y.toFixed(2)}" r="2.2" style="fill:var(--text-3)"><title>${escapeHtml(here)}</title></circle>`;
  }

  // Axis identity (which real assignment sits at each slot, for each semester)
  // is deliberately not printed on the chart itself as text - two different
  // assignments share one axis (one from each semester), so a plain text label
  // there would show one series' name while plotting the other's value too. A
  // small dot marker stands in for the slot instead, with the real identity
  // (both semesters' assignments, if a slot holds two) revealed only on hover -
  // same reasoning as why the vertex dots below carry their own tooltips too.
  function polygonFor(list, color) {
    if (!list.length) return '';
    const points = list.map((it, i) => polarToCartesian(cx, cy, radialScaleR(it.mark, rInner, rOuter), i * (360 / n)));
    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ') + ' Z';
    const dots = points.map((p, i) => {
      const it = list[i];
      const fadeAttr = it.excl ? ' fill-opacity="0.5"' : '';
      return `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="3" style="fill:${color}"${fadeAttr}><title>${escapeHtml(semItemTooltip(it))}</title></circle>`;
    }).join('');
    return `<path d="${path}" style="fill:${color};stroke:${color};pointer-events:none" fill-opacity="0.18" stroke-width="1.6" />${dots}`;
  }

  wrap.innerHTML = `
    ${tabs}
    <div class="chart-legend">
      <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-first)"></span>Semester 1</div>
      <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-third)"></span>Semester 2</div>
      <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--grade-22)"></span>Full year</div>
      <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--green-text)"></span>70% (First)</div>
    </div>
    <svg viewBox="0 0 300 300" width="300" height="300" xmlns="http://www.w3.org/2000/svg">
      ${rings}${spokes}${polygonFor(sem1, 'var(--grade-first)')}${polygonFor(sem2, 'var(--grade-third)')}${polygonFor(fullYear, 'var(--grade-22)')}${ringLabels}${axisMarkers}
    </svg>
  `;
}

let semBenchmarkView = 'all';
function setSemBenchmarkView(view) {
  semBenchmarkView = view;
  renderSemesterBenchmarkChart();
}

// Which group(s) (Semester 1, Semester 2, Full Year) the benchmark chart currently shows -
// independent of, and combined with, semBenchmarkView (the year filter) above. Multi-select:
// any non-empty subset can be on at once, each rendered as its own side-by-side panel (see
// renderSemesterBenchmarkChart) - this used to be forced to exactly one at a time back when
// the only layout option was stacking selections vertically (see that function's own
// comment for why that got too tall); going left-to-right instead sidesteps the height
// problem entirely; multi-select only actually makes sense now that the charts column has
// the width to spend on more than one panel side by side. Same runtime-only,
// not-persisted, not-undo-tracked category as every other view toggle in this file.
let semBenchmarkFilters = new Set(['sem1']);
function toggleSemBenchmarkFilter(filter) {
  if (semBenchmarkFilters.has(filter)) {
    if (semBenchmarkFilters.size === 1) return; // always keep at least one panel showing
    semBenchmarkFilters.delete(filter);
  } else {
    semBenchmarkFilters.add(filter);
  }
  renderSemesterBenchmarkChart();
}

const SEM_BENCHMARK_FILTERS = [['sem1', 'Semester 1'], ['sem2', 'Semester 2'], ['fullYear', 'Full year']];
function semBenchmarkFilterTabs(selected) {
  return `<div class="chart-view-tabs">${SEM_BENCHMARK_FILTERS.map(([val, label]) => {
    const active = selected.has(val);
    return `<button class="chart-view-tab ${active ? 'active' : ''}" onclick="toggleSemBenchmarkFilter('${val}')">${label}</button>`;
  }).join('')}</div>`;
}

// Groups a flat, mark-sorted list of assignment items by their parent module,
// for the benchmark chart's own presentation needs (buildSemesterAssignmentData
// itself stays flat and reusable - this grouping is specific to how the
// benchmark chart lays rows out, not part of the shared data shape). Modules
// are ordered by their own average mark descending, and each module's own
// assignments are (re-)sorted by mark descending within its cluster.
function groupSemItemsByModule(items) {
  const order = [];
  const byModule = new Map();
  items.forEach(it => {
    if (!byModule.has(it.moduleName)) { byModule.set(it.moduleName, []); order.push(it.moduleName); }
    byModule.get(it.moduleName).push(it);
  });
  return order.map(name => {
    const list = byModule.get(name);
    const avg = list.reduce((s, x) => s + x.mark, 0) / list.length;
    return { name, avg, items: list.slice().sort((a, b) => b.mark - a.mark) };
  }).sort((a, b) => b.avg - a.avg);
}

// Diverging horizontal bar chart: one row per assignment, bar length is that
// assignment's distance from 70%, coloured green at/above and red/danger below.
// The 0-point of the bar axis is literally 70%, not 0% - an assignment exactly
// on the First-Class boundary draws no bar at all, which is the intended
// reading, not a bug.
//
// Shows one panel per currently-selected filter (semBenchmarkFilters - Semester 1,
// Semester 2, Full Year, any non-empty subset), laid out left to right via
// buildBenchmarkPanel below. This used to be locked to exactly one at a time: the earlier
// stacked-groups design got noticeably tall once this moved from one row per module to one
// row per assignment, and adding a third group (Full Year) stacked on top of that would
// only compound it. Side by side doesn't have that problem - it spends width, not height -
// so it only became worth doing once the charts column itself had real width to spend (see
// .charts-column's max-width). Each panel prints its own small label above it now, since
// with more than one panel visible at once there's no longer a single highlighted tab that
// alone tells you which group you're looking at.
//
// Rows are NOT individually labelled with the assignment's name either. At
// assignment granularity a module can contribute several rows instead of just
// one, so printing a full name on every row would either force a very wide
// chart or crowd the row's own bar and deviation label into no space at all
// (which is exactly what happened when this chart was still one-row-per-module
// - a module with a long name and a large deviation had nowhere for its own
// deviation label to sit that didn't overlap the name). Instead, rows are
// clustered under a single small module-name header per module (see
// groupSemItemsByModule), and each row's own precise identity - module,
// assignment name, exact mark - is a hover tooltip via semItemTooltip.
function renderSemesterBenchmarkChart() {
  const wrap = document.getElementById('chart-sem-benchmark-wrap');
  if (!wrap || !state) return;

  const yearTabs = semChartViewTabs(semBenchmarkView, 'setSemBenchmarkView');
  const filterTabs = semBenchmarkFilterTabs(semBenchmarkFilters);
  const data = buildSemesterAssignmentData(semBenchmarkView);

  // Rendered left to right in this fixed order regardless of click order, so toggling one
  // filter off and back on never reshuffles panels that are already showing.
  const panels = SEM_BENCHMARK_FILTERS
    .filter(([val]) => semBenchmarkFilters.has(val))
    .map(([val, label]) => buildBenchmarkPanel(data[val] || [], label, semBenchmarkView))
    .join('');

  wrap.innerHTML = `
    ${yearTabs}
    ${filterTabs}
    <div class="chart-legend">
      <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--green-text)"></span>At/above 70%</div>
      <div class="chart-legend-item"><span class="chart-legend-dot" style="background:var(--danger-text)"></span>Below 70%</div>
    </div>
    <div class="sem-benchmark-panels">${panels}</div>
  `;
}

// One filter's worth of the benchmark chart (its own module/bar/deviation-label markup and
// its own independently-scaled maxAbsDev) - factored out of renderSemesterBenchmarkChart so
// however many filters are selected each just gets one of these side by side. Behaviour and
// visuals for a single selected filter are unchanged from before this was split out.
function buildBenchmarkPanel(items, label, view) {
  if (!items.length) {
    return `<div class="sem-benchmark-panel sem-benchmark-panel-empty">
      <div class="sem-benchmark-panel-label">${escapeHtml(label)}</div>
      <div class="chart-card-empty">No graded ${escapeHtml(label.toLowerCase())} assignments ${view === 'all' ? 'yet' : 'for this year yet'}.</div>
    </div>`;
  }

  const modules = groupSemItemsByModule(items);
  // Floor of 5 avoids a near-flat, uselessly over-zoomed scale on the rare view
  // where every mark happens to sit exactly at (or very near) 70%.
  const maxAbsDev = Math.max(5, ...items.map(it => Math.abs(it.mark - 70)));

  const rowHeight = 16, rowGap = 4, moduleHeaderGap = 14;
  // No permanent name column any more (see the function comment above) - just
  // enough left margin for a large negative-direction deviation label to sit
  // in clear of everything else, plus room for the module header text.
  const leftMargin = 50, rightMargin = 46, topMargin = 22;
  const halfWidth = 100; // px each side of the 0-deviation (70%) centre line
  const centerX = leftMargin + halfWidth;
  const chartWidth = leftMargin + halfWidth * 2 + rightMargin;

  let y = topMargin;
  let moduleHeaders = '', barRows = '';
  modules.forEach(mod => {
    moduleHeaders += `<text x="6" y="${(y + 8).toFixed(2)}" font-size="8.5" style="fill:var(--text-3)"><title>${escapeHtml(mod.name)}</title>${escapeHtml(truncateLabel(mod.name, 34))}</text>`;
    y += moduleHeaderGap;
    mod.items.forEach(it => {
      const dev = it.mark - 70;
      const barLen = (Math.abs(dev) / maxAbsDev) * halfWidth;
      const positive = dev >= 0;
      const barX = positive ? centerX : centerX - barLen;
      const color = positive ? 'var(--green-text)' : 'var(--danger-text)';
      const fadeAttr = it.excl ? ' fill-opacity="0.4"' : '';
      const devLabel = (positive ? '+' : '') + dev.toFixed(1) + '%';
      const devLabelX = positive ? centerX + barLen + 4 : centerX - barLen - 4;
      const rowMidY = y + rowHeight / 2;
      barRows += `
        <rect x="${barX.toFixed(2)}" y="${y}" width="${Math.max(0.5, barLen).toFixed(2)}" height="${rowHeight - 5}" rx="2" style="fill:${color}"${fadeAttr}><title>${escapeHtml(semItemTooltip(it))}</title></rect>
        <text x="${devLabelX.toFixed(2)}" y="${(rowMidY + 3).toFixed(2)}" text-anchor="${positive ? 'start' : 'end'}" font-size="9" font-weight="600" style="fill:${color}">${devLabel}</text>
      `;
      y += rowHeight + rowGap;
    });
  });
  const chartHeight = y + 4;

  const centerLine = `<line x1="${centerX}" y1="${topMargin - 10}" x2="${centerX}" y2="${chartHeight - 4}" style="stroke:var(--text-2)" stroke-width="1.4" />
    <text x="${centerX}" y="${topMargin - 14}" text-anchor="middle" font-size="9" font-weight="600" style="fill:var(--text-2)">70%</text>`;

  return `
    <div class="sem-benchmark-panel">
      <div class="sem-benchmark-panel-label">${escapeHtml(label)}</div>
      <svg viewBox="0 0 ${chartWidth} ${chartHeight}" width="${chartWidth}" height="${chartHeight}" xmlns="http://www.w3.org/2000/svg">
        ${centerLine}${moduleHeaders}${barRows}
      </svg>
    </div>`;
}
